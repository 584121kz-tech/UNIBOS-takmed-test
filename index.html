<title>Тест по тактической медицине</title>

<style>
/* Layout: одна узкая колонка «полевой карточки»; шапка с отметкой времени в формате 24 ч, как на жгуте. */
:root {
  --bg: #eceeea;
  --surface: #fbfcfa;
  --ink: #1b221e;
  --muted: #5a665f;
  --line: #ccd3cd;
  --accent: #4a5b26;
  --accent-soft: #e1e7d3;
  --on-accent: #fbfcfa;
  --ok: #2b7546;
  --ok-soft: #dcefe2;
  --bad: #b3301d;
  --bad-soft: #f6dfda;
  --font-display: "Fira Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "JetBrains Mono", "Consolas", "Menlo", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1a201d; --ink: #e4eae6; --muted: #97a39c; --line: #2d3631;
    --accent: #a8bb6c; --accent-soft: #283019; --on-accent: #111513;
    --ok: #63bd83; --ok-soft: #17301f; --bad: #ee6b56; --bad-soft: #3a1c17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1a201d; --ink: #e4eae6; --muted: #97a39c; --line: #2d3631;
  --accent: #a8bb6c; --accent-soft: #283019; --on-accent: #111513;
  --ok: #63bd83; --ok-soft: #17301f; --bad: #ee6b56; --bad-soft: #3a1c17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 660px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.stamp { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }

h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
h2 { font-size: 1.5rem; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mode {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; font: inherit; cursor: pointer;
}
.mode:hover { border-color: var(--accent); }
.mode .num { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.mode .name { font-weight: 600; }
.mode .hint { color: var(--muted); font-size: .9rem; }

.by-topic { display: flex; flex-direction: column; gap: 10px; }
.by-topic h3 { font-family: var(--font-display); font-weight: 600; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
.tlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.tbtn {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-align: left;
  font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 12px 4px; cursor: pointer;
}
.tbtn:hover { background: var(--accent-soft); }
.tbtn .tn { min-width: 0; }
.tbtn .tno { font-family: var(--font-mono); color: var(--muted); font-size: .8rem; margin-right: 8px; }
.tbtn .tc { color: var(--muted); font-size: .9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

.rules { display: flex; flex-direction: column; gap: 6px; padding-left: 1.1em; margin: 0; color: var(--muted); font-size: .95rem; }

.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; }

.btn {
  font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 20px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 8px 0; font-weight: 500; text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; }
.chip { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 2px 10px; }
.pg { font-family: var(--font-mono); color: var(--muted); }
.q { font-size: 1.15rem; font-weight: 600; line-height: 1.4; }
.note { font-size: .85rem; color: var(--muted); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.opt span { min-width: 0; }

.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score .big { font-family: var(--font-display); font-weight: 700; font-size: 4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { color: var(--muted); font-size: 1.1rem; }

.section { display: flex; flex-direction: column; gap: 12px; }
.topics { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.topics li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.topics .t { min-width: 0; }
.topics .c { color: var(--bad); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

.miss { border-left: 4px solid var(--bad); }
.ans { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; list-style: none; }
.ans li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; font-size: .95rem; }
.ans .mark { font-family: var(--font-mono); font-size: .75rem; flex: none; padding-top: 3px; width: 6.5em; }
.ans li.right { background: var(--ok-soft); }
.ans li.right .mark { color: var(--ok); }
.ans li.wrong { background: var(--bad-soft); }
.ans li.wrong .mark { color: var(--bad); }
.ans li.plain .mark { color: var(--muted); }
.why { font-size: .95rem; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 12px; }
.why b { font-weight: 600; }

.allgood { background: var(--ok-soft); border-radius: 10px; padding: 16px; }
footer { color: var(--muted); font-size: .8rem; }

@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

const BANK = [{"id": "a1-01", "topic": 16, "pages": "52", "q": "Что входит в Эшелон 0 («всегда с собой и быстрый доступ»)?", "options": ["Два жгута или турникета (один — в отдельном подсумке)", "Обезболивающее Нефопам или Промедол", "Перманентный маркер, ППИ и наручные часы", "Внутривенный катетер и капельница"], "correct": [0, 1, 2], "explain": "Эшелон 0: жгут/турникет в отдельном подсумке — 1 шт., ещё жгут/турникет — 1 шт., Нефопам/Промедол — 1 шт., перманентный маркер, ППИ (советский серый), наручные часы."}, {"id": "a1-02", "topic": 16, "pages": "52", "q": "Что такое аптечка Эшелона 1?", "options": ["Аптечка для самопомощи с доступом любой рукой", "Аптечка, из которой вам будут оказывать помощь товарищи", "«Блиндажная» аптечка для лечения болезней", "Рюкзак медика"], "correct": [0], "explain": "Эшелон 1 — аптечка для самопомощи, доступ любой рукой; подсумок на поясе (вариант — на 2 или 10 часов). Эшелон 2 — для взаимопомощи, Эшелон 3 — «Блиндажная»."}, {"id": "a1-03", "topic": 16, "pages": "52", "q": "Что лежит в таблетнице (пилбоксе) Эшелона 1?", "options": ["Моксифлоксацин 400 мг (антибиотик) — 1 таб.", "Транексамовая кислота 500 мг (гемостатик) — 2 таб.", "Ондансетрон 8 мг (от рвоты) — 1 таб.", "Промедол в таблетках — 2 таб."], "correct": [0, 1, 2], "explain": "Таблетница: Моксифлоксацин 400 мг — 1, Парацетамол 500 мг — 2, Мелоксикам 15 мг — 1, ТНК 500 мг — 2, Ондансетрон 8 мг — 1. По желанию её можно перенести в Эшелон 2."}, {"id": "a1-04", "topic": 16, "pages": "53", "q": "Аптечка Эшелона 2 — это…", "options": ["Аптечка для взаимопомощи — из неё ВАМ будут оказывать помощь", "Аптечка для самопомощи, доступ любой рукой", "Набор для лечения хронических заболеваний", "Запас медика на взвод"], "correct": [0], "explain": "Эшелон 2 — аптечка для взаимопомощи (расширенный набор), из которой помощь будут оказывать вам. Отрывной подсумок на поясе на 5, 6 или 7 часов либо на камербанде сбоку."}, {"id": "a1-05", "topic": 16, "pages": "53", "q": "Что входит в аптечку Эшелона 2 (один из вариантов состава)?", "options": ["Игла для декомпрессии пневмоторакса 10G", "Воздуховод Гведела и носовой воздуховод", "Карточка раненого", "Пакет Стерофундина 500 мл"], "correct": [0, 1, 2], "explain": "В Эшелоне 2, кроме прочего: турникет, жгут, бандажи, Нефопам, Z-тампонада, окклюзионные пластыри, воздуховоды, игла 10G, катетер 18G, Цефтриаксон, термоодеяла, глазной щиток, ИПП-11, карточка раненого. Растворов для капельниц в нём нет."}, {"id": "a1-06", "topic": 16, "pages": "55", "q": "Почему в аптечке продлённой помощи важны антибиотики и своевременные перевязки?", "options": ["Раневая инфекция развивается уже через 4–6 часов после ранения, а эвакуация может затянуться", "Антибиотики заменяют обезболивание", "Без антибиотиков не работает жгут", "Перевязки нужны только для красоты"], "correct": [0], "explain": "Раневая инфекция развивается уже через 4–6 часов после ранения, поэтому при затянувшейся эвакуации важны профилактика инфекции и перевязки не реже 1 раза в день."}, {"id": "a1-07", "topic": 16, "pages": "55", "q": "Аптечка продлённой помощи: как принимать антибиотики?", "options": ["Цефтриаксон: сразу после ранения 2 г, далее 2 г 1 раз в сутки", "Метронидазол: сразу 500 мг, далее 500 мг каждые 8 часов", "Метронидазол: 500 мг 1 раз в сутки", "Амоксиклав: 1 г каждые 4 часа"], "correct": [0, 1], "explain": "Цефтриаксон 2 г сразу и далее 1 раз в сутки (в/м — развести 4 мл NaCl). К нему — Метронидазол 500 мг каждые 8 часов. Таблетированный вариант: Амоксиклав 2 г сразу, далее 1 г каждые 12 часов, или Моксифлоксацин 400 мг раз в сутки — плюс Метронидазол."}, {"id": "a1-08", "topic": 16, "pages": "55", "q": "Аптечка продлённой помощи: схема обезболивания?", "options": ["Парацетамол 1000 мг каждые 8 часов + Мелоксикам (15 мг в первые сутки, далее 7,5 мг раз в сутки)", "Промедол каждые 4 часа", "Только Кеторолак по необходимости", "Нефопам 6 раз в сутки"], "correct": [0], "explain": "Парацетамол: сразу 1000 мг (2 таб.), далее по 1000 мг каждые 8 часов. Мелоксикам: 15 мг в первые сутки, далее 7,5 мг 1 раз в сутки."}, {"id": "a1-09", "topic": 16, "pages": "56", "q": "Эшелон 3 («Блиндажная» аптечка). Что верно?", "options": ["Препараты для лечения своих хронических заболеваний каждый собирает сам", "При добавлении незнакомых препаратов важно читать инструкцию", "Это аптечка для остановки кровотечения на поле боя", "Её носят на поясе для доступа любой рукой"], "correct": [0, 1], "explain": "«Блиндажная» аптечка — для лечения бытовых и хронических заболеваний на позиции. Препараты от персональных хронических болезней каждый формирует сам, незнакомые — только после чтения инструкции."}, {"id": "a1-10", "topic": 16, "pages": "56", "q": "«Блиндажная» аптечка: какие пары «препарат — применение» верны?", "options": ["Лоперамид — диарея неинфекционная (без температуры и интоксикации)", "Нифуроксазид — кишечная инфекция", "Цетрин — аллергия", "Мебендазол — изжога"], "correct": [0, 1, 2], "explain": "Лоперамид — неинфекционная диарея, Нифуроксазид — кишечная инфекция, Цетрин — аллергия. Мебендазол — от глистов; при изжоге — Нексиум."}, {"id": "a1-11", "topic": 16, "pages": "56–57", "q": "«Блиндажная» аптечка: что верно?", "options": ["Кофеин-бензоат — стимулятор, нельзя гипертоникам", "Тобрадекс — глазные капли с антибиотиком", "Регидрон — при обезвоживании от диареи и рвоты", "Ацикловир — противогрибковое средство"], "correct": [0, 1, 2], "explain": "Кофеин-бензоат может вызвать тахикардию и повышение давления — нельзя гипертоникам. Тобрадекс — капли с антибиотиком, Регидрон — от обезвоживания. Ацикловир — от герпеса; противогрибковые — Клотримазол, Тербикс."}, {"id": "a1-12", "topic": 16, "pages": "56–57", "q": "«Блиндажная» аптечка: что применяют при отравлении?", "options": ["Энтеросгель", "Экстрасорб", "Бисакодил", "Мидокалм"], "correct": [0, 1], "explain": "При отравлении — Энтеросгель (любой этиологии, в т. ч. алкоголь) и Экстрасорб (интоксикации). Бисакодил — при запоре, Мидокалм — миорелаксант при болях в опорно-двигательном аппарате."}, {"id": "a2-01", "topic": 17, "pages": "58", "q": "Какой кристаллоид — препарат выбора и почему?", "options": ["Стерофундин — содержит электролиты, близкие по составу к плазме крови", "Глюкоза 40% — даёт энергию", "NaCl 0,9% — самый концентрированный", "Гелофузин — дольше держится в сосудах"], "correct": [0], "explain": "Препарат выбора среди кристаллоидов — Стерофундин 0,5 л (электролиты близки к плазме). Альтернатива — NaCl 0,9% и раствор Рингера. Гелофузин — коллоид. Перед применением всегда проверять срок годности."}, {"id": "a2-02", "topic": 17, "pages": "58", "q": "Растворы замёрзли. Что верно?", "options": ["Кристаллоиды после разморозки восстанавливают свойства", "Коллоиды после разморозки теряют свойства", "Коллоиды после разморозки можно применять как обычно", "Кристаллоиды после разморозки применять нельзя"], "correct": [0, 1], "explain": "Замёрзшие кристаллоиды после разморозки восстанавливают свойства. Коллоиды после замерзания ТЕРЯЮТ свойства и портятся также при перегреве выше 40 °C."}, {"id": "a2-03", "topic": 17, "pages": "58", "q": "Гелофузин (коллоид). Что верно?", "options": ["Вводят капельно 500 мл, 1 капля в секунду", "Объём коллоидов примерно в 2 раза меньше, чем кристаллоидов", "Суммарно с кристаллоидами — не более 1500 мл", "Коллоидов вливают больше, чем кристаллоидов"], "correct": [0, 1, 2], "explain": "Коллоиды забирают жидкость из тканей в сосуды, поэтому их объём примерно в 2 раза меньше, чем кристаллоидов, а суммарно — не более 1500 мл. Гелофузин лучше восстанавливает микроциркуляцию и дольше держится в русле."}, {"id": "a2-04", "topic": 17, "pages": "59", "q": "Транексамовая кислота. Что верно?", "options": ["В разы эффективнее аминокапроновой кислоты", "Если в/в невозможно — 1000 мг внутрь (таблетками)", "При продолжающемся кровотечении — до 1000 мг 3 раза в сутки, не более 4 суток подряд", "При невозможности в/в — ввести внутримышечно"], "correct": [0, 1, 2], "explain": "ТНК — препарат выбора среди гемостатиков, тормозит рассасывание тромба. Только в/в, в/м не вводить; при невозможности в/в — 1000 мг внутрь. Альтернативы: аминокапроновая кислота 5% капельно, Этамзилат 500 мг в/в или в/м (не смешивать с другими)."}, {"id": "a2-05", "topic": 17, "pages": "59", "q": "Норэпинефрин (норадреналин). Что верно?", "options": ["Только в/в медленно, в разведении NaCl в шприце 20 мл", "Прекращают, когда верхнее давление достигло 90 мм рт. ст. (пульс на лучевой)", "Можно вводить неразведённым", "Можно смешивать с другими препаратами"], "correct": [0, 1], "explain": "Норэпинефрин сужает сосуды и повышает давление. Вводят только в/в медленно в разведении; не вводить неразведённым и не смешивать с другими препаратами. Не вводить до начала восполнения ОЦК."}, {"id": "a2-06", "topic": 17, "pages": "60", "q": "Как вводят Адреналин (1 мг/мл) внутримышечно?", "options": ["0,5 мг (½ ампулы) в плечо, бедро или ягодицу", "5 мг (5 ампул) в любую мышцу", "Целую ампулу подкожно в живот", "Внутримышечно Адреналин не вводят"], "correct": [0], "explain": "Адреналин — альтернатива Норэпинефрину: в/м 0,5 мг (½ ампулы) в плечо, бедро или ягодицу, или в/в 0,5 мг в разведении. При отсутствии эффекта через 5–10 минут повторить. Учащает сердцебиение."}, {"id": "a2-07", "topic": 17, "pages": "60", "q": "При каком состоянии НЕЛЬЗЯ вводить Кордиамин?", "options": ["Эпилепсия, судороги в анамнезе", "Угнетение дыхания", "Гипотония", "Когда больше нельзя вливать растворы, а давление ниже 90"], "correct": [0], "explain": "Кордиамин — аналептик (стимулятор ЦНС, дыхательного и сосудодвигательного центров) при угнетении дыхания и гипотонии. Противопоказан при эпилепсии и судорогах в анамнезе. Максимальная суточная доза — 6 мл."}, {"id": "a2-08", "topic": 17, "pages": "60", "q": "Показания к Дексаметазону:", "options": ["Любой шок, в том числе геморрагический", "Тяжёлые аллергические реакции и бронхоспазм", "ЧМТ", "Гипогликемия"], "correct": [0, 1, 2], "explain": "Дексаметазон — глюкокортикостероид: при любом шоке, тяжёлой аллергии, бронхоспазме, для снижения воспаления, при ЧМТ. Повышает глюкозу и давление — при диабете и гипертонии контролировать. Не смешивать в одном шприце с другими препаратами."}, {"id": "a2-09", "topic": 17, "pages": "60", "q": "Во сколько раз Преднизолон слабее Дексаметазона?", "options": ["В 7 раз", "В 2 раза", "Одинаковы по силе", "Преднизолон сильнее в 3 раза"], "correct": [0], "explain": "Преднизолон по силе действия уступает Дексаметазону в 7 раз. Преднизолон — альтернатива: в/в 60–90 мг, максимально до 120 мг; в/м — без разведения."}, {"id": "a2-10", "topic": 17, "pages": "61", "q": "Супрастин и Димедрол при аллергии. Что верно?", "options": ["Димедрол, в отличие от Супрастина, имеет седативный эффект (сильная сонливость)", "При отёке Квинке и выраженной крапивнице добавляют гормоны (Дексаметазон или Преднизолон)", "Супрастин вызывает более сильную сонливость, чем Димедрол", "При отёке Квинке гормоны запрещены"], "correct": [0, 1], "explain": "Препарат выбора — Супрастин 20 мг в/м. Димедрол — альтернатива с седативным эффектом (сонливость, возможно снижение давления). При отёке Квинке или обильной сыпи добавляют Дексаметазон 8–12 мг или Преднизолон 60–90 мг."}, {"id": "a2-11", "topic": 17, "pages": "62", "q": "Обезболивающие при среднем болевом синдроме. Что верно?", "options": ["Кеторолак — не более 3–4 ампул в сутки", "Мелоксикам в ампулах — только в/м, 1 раз в сутки", "Парацетамол + Мелоксикам усиливают друг друга и не усиливают кровоточивость", "Кеторолак можно вводить без ограничений"], "correct": [0, 1, 2], "explain": "Таблетки: Парацетамол 1 г + Мелоксикам 15 мг — препарат выбора (действует через ~30 минут, не усиливает кровоточивость). Ампулы: Кеторолак — не более 3–4 в сутки; Дексалгин — не более 2–3; Мелоксикам — только в/м 1 раз в сутки."}, {"id": "a2-12", "topic": 17, "pages": "63", "q": "Как вводят Нефопам?", "options": ["В/в — только в разбавленном виде (20 мг + 18 мл NaCl, медленно)", "Во время введения и 15–20 минут после пациент должен лежать", "В/в — неразбавленным, быстро", "После укола пациенту нужно сразу встать и походить"], "correct": [0, 1], "explain": "Нефопам — ненаркотическое обезболивающее; рекомендуемая доза 20 мг. В/в — только в разведении или через порт в бутылку с инфузией. Во время введения и 15–20 минут после — положение лёжа. Часто вызывает тошноту — Ондансетрон или Метоклопрамид."}, {"id": "a2-13", "topic": 17, "pages": "63", "q": "Как правильно применять антисептики?", "options": ["Перекись водорода на слизистые не лить", "Бетадин в рану стараются не заливать — им пропитывают бинты и салфетки", "Бетадин можно смешивать с Левомеколем", "Перекись лить на слизистые без ограничений"], "correct": [0, 1, 2], "explain": "Перекисью промывают под несильным давлением, на слизистые не льют. Хлоргексидином промывают рану, Бетадин — на повязку (можно смешивать с Левомеколем)."}, {"id": "a2-14", "topic": 17, "pages": "64–67", "q": "Какие утверждения о препаратах верны?", "options": ["Метронидазол категорически несовместим с алкоголем", "Фуросемид противопоказан при гиповолемии и обезвоживании", "Лидокаин и Новокаин в/в не вводят", "Эуфиллин в/в вводят быстро, за несколько секунд"], "correct": [0, 1, 2], "explain": "Метронидазол несовместим с алкоголем; Фуросемид — нельзя при гиповолемии и дегидратации; местные анестетики в/в не вводят. Эуфиллин вводят медленно (4–6 минут): быстрое введение вызывает резкое снижение давления и аритмию."}, {"id": "a2-15", "topic": 17, "pages": "65–66", "q": "Антидоты: какие пары «антидот — отравление» верны?", "options": ["Налоксон — передозировка опиоидов", "Натрия тиосульфат — цианиды, хлорциан", "Ацизол — угарный газ (СО)", "Атропин — передозировка опиоидов"], "correct": [0, 1, 2], "explain": "Налоксон — опиоиды (промедол, трамадол, героин, фентанил). Натрия тиосульфат — цианиды и хлорциан. Ацизол — угарный газ. Атропин — антидот при нервно-паралитических и фосфорных БОВ, также при брадикардии."}, {"id": "a3-01", "topic": 18, "pages": "68", "q": "Какие препараты входят в метаболический коктейль «Троица»?", "options": ["Фенотропил", "Милдронат", "Гипоксен", "Кофеин"], "correct": [0, 1, 2], "explain": "«Троица»: Фенотропил (повышает норадреналин, дофамин, серотонин в мозге), Милдронат (быстрое восстановление энергетических резервов), Гипоксен (особенно для мозга, сердца, печени). Кофеин — психостимулятор, отдельная группа."}, {"id": "a3-02", "topic": 18, "pages": "68", "q": "Как принимают Милдронат для повышения работоспособности?", "options": ["500 мг 2 раза в день до 14 дней", "1 таблетку раз в неделю", "По 2 г перед каждым боем", "Без ограничений по времени"], "correct": [0], "explain": "Милдронат: 500 мг × 2 раза в день до 14 дней. Восстанавливает баланс между доставкой кислорода и потребностью клеток, оказывает тонизирующее действие."}, {"id": "a3-03", "topic": 18, "pages": "68", "q": "Как правильно принимать метаболические препараты («Троица»)?", "options": ["Курсом по рецепту; перед интенсивными нагрузками — двойные дозы", "Разово в момент ранения", "Только при отравлении", "Строго по 1 таблетке раз в месяц"], "correct": [0], "explain": "Препараты следует принимать курсом согласно рецепту; перед интенсивными нагрузками рекомендуется принимать двойные дозы."}, {"id": "a3-04", "topic": 18, "pages": "68–69", "q": "Какие средства относятся к адаптогенам?", "options": ["Элеутерококк", "Родиола", "Лимонник", "Пикамилон"], "correct": [0, 1, 2], "explain": "Адаптогены — дешёвые растительные общетонизирующие средства: Элеутерококк, Аралия, Родиола, Лимонник, Женьшень, Левзея; спиртовые настойки эффективнее таблеток. Пикамилон — ноотроп."}, {"id": "a3-05", "topic": 18, "pages": "69", "q": "Что верно о кофеине как психостимуляторе?", "options": ["Разовая доза — 100–200 мг", "Продлевает интеллектуальную активность на 2–3 часа", "При злоупотреблении растёт число аденозиновых рецепторов — вялость может держаться несколько дней", "Можно принимать без ограничений — привыкания не бывает"], "correct": [0, 1, 2], "explain": "Кофеин повышает бодрость на 2–3 часа, разовая доза 100–200 мг. Злоупотреблять нельзя: увеличивается количество аденозиновых рецепторов, и вялость может сохраняться несколько дней."}, {"id": "a3-06", "topic": 18, "pages": "69", "q": "Как применяют успокоительный коктейль Ящикова (60–80 капель в 1–2 ложках воды)?", "options": ["Долго полощут рот до полного всасывания — не глотают и не выплёвывают", "Выпивают залпом", "Вводят внутримышечно", "Капают в нос"], "correct": [0], "explain": "Коктейль Ящикова — равные доли настоек пустырника, валерианы, корня пиона и Корвалола. Раствором полощут рот длительное время до полного всасывания, не глотая и не выплёвывая."}, {"id": "a4-01", "topic": 19, "pages": "70", "q": "На что рассчитана укладка рюкзака медика в конспекте?", "options": ["На 2 раненых на 1 сутки эвакуации", "На 1 раненого на 3 суток", "На взвод на неделю", "На 10 раненых на 1 сутки"], "correct": [0], "explain": "Укладка рюкзака медика рассчитана на 2 раненых на 1 сутки эвакуации."}, {"id": "a4-02", "topic": 19, "pages": "70", "q": "В каком порядке быстроты доступа раскладывают содержимое рюкзака медика?", "options": ["Кровь → дыхание → ампульница → инструменты → иммобилизация → фарма → прочее", "Фарма → инструменты → кровь → дыхание", "Иммобилизация → кровь → прочее → дыхание", "Прочее → фарма → дыхание → кровь"], "correct": [0], "explain": "Всё раскладывают по группам в подсумки и карманы в порядке быстроты доступа: кровь, дыхание, ампульница, инструменты, иммобилизация, фарма, прочее."}, {"id": "a4-03", "topic": 19, "pages": "70", "q": "Сколько турникетов в укладке рюкзака медика?", "options": ["4 турникета (плюс 2 жгута)", "1 турникет", "2 турникета", "10 турникетов"], "correct": [0], "explain": "Кровоостанавливающие в рюкзаке: турникет — 4 шт., жгут — 2 шт., широкий полимерный жгут 1,5 м — 1 шт., зажим Москит — 1 шт."}, {"id": "a4-04", "topic": 19, "pages": "70", "q": "Какие кровезаменители в укладке рюкзака медика?", "options": ["Стерофундин 0,5 л — 3 бутылки и Гелофузин 0,5 л — 1 бутылка", "NaCl 0,9% — 10 литров", "Только Гелофузин — 4 бутылки", "Растворов в рюкзаке нет"], "correct": [0], "explain": "Кристаллоиды: Стерофундин 0,5 — 3 бутылки; коллоиды: Гелофузин 0,5 — 1 бутылка; также Натрия гидрокарбонат 4% 0,2 — 1 бутылка."}, {"id": "a4-05", "topic": 19, "pages": "71", "q": "Сколько ампул транексамовой кислоты (50 мг/мл, 5 мл) в ампульнице медика?", "options": ["8 ампул (на 2 полные дозы по 1 г)", "1 ампула", "2 ампулы", "20 ампул"], "correct": [0], "explain": "В ампульнице — ТНК 50 мг/мл по 5 мл, 8 ампул. Одна доза 1 г — это 4 такие ампулы, значит запас на 2 раненых."}, {"id": "a4-06", "topic": 19, "pages": "70", "q": "Какое оборудование входит в рюкзак медика?", "options": ["Пульсоксиметр", "Механический тонометр", "Глюкометр с тест-полосками", "Дефибриллятор"], "correct": [0, 1, 2], "explain": "Оборудование: пульсоксиметр, механический тонометр, термометр, атравматические ножницы, маркер, ХИС, налобный фонарик, глюкометр, пинцеты, скальпели, мешок Амбу и др. Дефибриллятора в укладке нет."}, {"id": "a5-01", "topic": 20, "pages": "72", "q": "Какие вещества относятся к нервно-паралитическим БОВ?", "options": ["Ви-икс (VX)", "Зарин", "Зоман", "Иприт"], "correct": [0, 1, 2], "explain": "Нервно-паралитические: VX, зарин (GB), зоман (GD), табун (GA). Иприт — кожно-нарывное."}, {"id": "a5-02", "topic": 20, "pages": "72", "q": "К какой группе БОВ относятся иприт и люизит?", "options": ["Кожно-нарывные", "Удушающие", "Психотропные", "Раздражающие"], "correct": [0], "explain": "Иприт (H, HD) и люизит (L) — кожно-нарывные отравляющие вещества."}, {"id": "a5-03", "topic": 20, "pages": "72", "q": "Какие пары «вещество — группа БОВ» верны?", "options": ["Фосген — удушающие", "Синильная кислота, хлорциан — общеядовитые", "Си-Эс (CS), Си-Ар (CR) — раздражающие", "Зарин — кожно-нарывные"], "correct": [0, 1, 2], "explain": "Удушающие: фосген, дифосген, хлорпикрин, хлор. Общеядовитые: синильная кислота, хлорциан. Психотропные: BZ, LSD. Раздражающие: CN, адамсит, CR, CS. Зарин — нервно-паралитическое."}, {"id": "a5-04", "topic": 20, "pages": "72", "q": "Основные принципы защиты от БОВ:", "options": ["Противогазы", "Защитные плащи и перчатки", "Индивидуальные противохимические пакеты и антидоты", "Мокрая повязка вместо противогаза — достаточно"], "correct": [0, 1, 2], "explain": "Принципы защиты: противогазы, плащи, защитные перчатки, индивидуальные противохимические пакеты, использование антидотов."}, {"id": "a5-05", "topic": 20, "pages": "72", "q": "Как применяют Атропин против нервно-паралитических БОВ?", "options": ["2–8 мг, затем по 2 мг каждые 15 минут до улучшения", "Однократно 0,1 мг", "По 1 мг раз в сутки", "Атропин при нервно-паралитических БОВ не применяют"], "correct": [0], "explain": "Атропина сульфат 0,1% в/м — самостоятельно, если больше ничего нет, или вместе с другими антидотами: 2–8 мг, затем по 2 мг каждые 15 минут до улучшения. Другие антидоты группы: Будаксим, Дипироксим, Изонитрозин, Диэтиксим."}, {"id": "a5-06", "topic": 20, "pages": "72", "q": "Антидоты против кожно-нарывных БОВ. Что верно?", "options": ["Для иприта антидотов нет", "Для люизита — Унитиол", "Для люизита — БАЛ (димеркапрол)", "Для иприта — Атропин"], "correct": [0, 1, 2], "explain": "Для иприта антидотов нет. Для люизита: Унитиол 5% 5 мл в/м (3 раза в первые сутки, затем 1 раз), Тиоктацид (беречь от света), БАЛ (димеркапрол)."}, {"id": "a5-07", "topic": 20, "pages": "72", "q": "Какие антидоты применяют против общеядовитых БОВ?", "options": ["Антициан", "Тиосульфат натрия 30%", "Амилнитрит + Пропилнитрит", "Будаксим"], "correct": [0, 1, 2], "explain": "Против общеядовитых: Антициан, Амилнитрит + Пропилнитрит, Тиосульфат натрия, Хромосмон, Оксикобаламин, Глюкоза 40%, Нитрит натрия, Дикобальтовая соль ЭДТА. Будаксим — против нервно-паралитических."}, {"id": "a5-08", "topic": 20, "pages": "73", "q": "Какие антидоты применяют против психотропных БОВ?", "options": ["Аминостигмин", "Физостигмин", "Галантамин", "Унитиол"], "correct": [0, 1, 2], "explain": "Против психотропных: Аминостигмин 0,1% в/м каждые 2 часа, Физостигмин (седативный эффект), Галантамин. Унитиол — против люизита."}, {"id": "a5-09", "topic": 20, "pages": "73", "q": "Медсредства для защиты от БОВ: какие пары «средство — назначение» верны?", "options": ["Пакет противохимический индивидуальный — частичная специальная обработка открытых участков кожи (лицо, шея, кисти)", "Пеликсим — раннее лечение отравлений ФОВ, при первых признаках", "Препарат Б-190 — защита от проникающей радиации", "Доксициклин — защита от проникающей радиации"], "correct": [0, 1, 2], "explain": "ИПП — обработка открытых участков кожи; Пеликсим — раннее лечение отравлений ФОВ; Б-190 — радиопротектор; Доксициклин — профилактика раневой инфекции и бактериологических поражений; Ондансетрон — профилактика первичной реакции на облучение."}, {"id": "a6-01", "topic": 21, "pages": "74", "q": "Памятка: как принимать Ибупрофен при боли?", "options": ["400 мг до 4 раз в сутки", "Курс не более 5–7 дней", "Обязательно под «прикрытием» Омепразола или Нексиума", "Без ограничений по сроку, защита желудка не нужна"], "correct": [0, 1, 2], "explain": "Ибупрофен 400 мг до 4 раз в сутки, курс не более 5–7 дней, обязательно вместе с Омепразолом или Нексиумом для защиты желудка."}, {"id": "a6-02", "topic": 21, "pages": "74", "q": "Памятка: лечение кашля. Что верно?", "options": ["При влажном кашле отхаркивающие не пьют на ночь", "АЦЦ — 600 мг утром после еды", "Ренгалин и Омнитус — при сухом кашле", "АЦЦ лучше принимать на ночь"], "correct": [0, 1, 2], "explain": "Влажный кашель: АЦЦ 600 мг утром, Амброксол, Мукалтин, Бромгексин; отхаркивающие на ночь не пить. Сухой кашель (до мокроты): Ренгалин, Омнитус. Антибиотики — при температуре, длительности более 4–5 дней, гнойной мокроте, боли в груди."}, {"id": "a6-03", "topic": 21, "pages": "74", "q": "Памятка: что применяют при бронхоспазме (бронхиальная астма, ХОБЛ)?", "options": ["Беродуал аэрозоль 2 дозы (без эффекта — ещё 2) или Сальбутамол 2 дозы", "Нитроглицерин под язык", "Каптоприл под язык", "Корвалол 30 капель"], "correct": [0], "explain": "При бронхоспазме — Беродуал 2 дозы (при отсутствии эффекта ещё 2) или Сальбутамол 100 мкг/доза 2 дозы."}, {"id": "a6-04", "topic": 21, "pages": "74", "q": "Памятка: что дают при остром инфаркте миокарда или приступе стенокардии?", "options": ["Нитроглицерин 1 таблетку под язык", "Цитрамон 2 таблетки", "Кофеин-бензоат 100 мг", "Лоперамид"], "correct": [0], "explain": "При остром инфаркте миокарда или приступе стенокардии — Нитроглицерин 1 таблетка под язык."}, {"id": "a6-05", "topic": 21, "pages": "74", "q": "Памятка: что применяют при ВЫСОКОМ артериальном давлении?", "options": ["Каптоприл 25–50 мг под язык", "Моксонидин 0,4 мг внутрь", "Цитрамон", "Кофеин-бензоат"], "correct": [0, 1], "explain": "Гипертензия: Каптоприл 25–50 мг под язык, Моксонидин 0,4 мг; при давлении с тахикардией — Бисопролол. Цитрамон и Кофеин-бензоат — при НИЗКОМ давлении."}, {"id": "a6-06", "topic": 21, "pages": "75", "q": "Памятка: когда принимать сорбенты (Полисорб, уголь, Энтеросгель, Экстрасорб)?", "options": ["За 1 час до или через час после еды и приёма других лекарств", "Вместе с едой", "Вместе с другими лекарствами, чтобы не забыть", "Только на ночь"], "correct": [0], "explain": "Все сорбенты принимают за 1 час до или через час после еды и приёма других лекарств — иначе они поглощают и их."}, {"id": "a6-07", "topic": 21, "pages": "75", "q": "Памятка: Лоперамид при диарее. Что верно?", "options": ["Только при неинфекционной диарее", "При инфекции и температуре — нельзя", "По 1 капсуле после каждого жидкого стула, не более 8 раз в сутки", "Лучший выбор при кишечной инфекции с температурой"], "correct": [0, 1, 2], "explain": "Лоперамид — при неинфекционной диарее: по 1 капсуле после каждого жидкого стула, не более 8 в сутки; при инфекции и температуре нельзя. При инфекционной — Фуразолидон, Нифуроксазид, Смекта."}, {"id": "a6-08", "topic": 21, "pages": "79–80", "q": "Памятка: инфекционная диарея. Что верно?", "options": ["Водянистая диарея — антибиотики не показаны; Регидрон, обильное питьё, сорбенты", "Кровянистая диарея — нельзя Смекту и активированный уголь", "Кровянистая диарея — Норфлоксацин, Рифаксимин или Метронидазол", "Водянистая диарея — сразу два антибиотика"], "correct": [0, 1, 2], "explain": "Водянистая — без антибиотиков (при выраженной — Фуразолидон). Кровянистая — Норфлоксацин, Рифаксимин или Метронидазол (при их отсутствии — Фуразолидон или Энтерофурил) + сорбенты, но не Смекта и не уголь."}, {"id": "a6-09", "topic": 21, "pages": "76", "q": "Памятка: как принимать Тамифлю (Осельтамивир) при гриппе?", "options": ["Начать не позднее 2 дней от начала симптомов; 1 капсула 2 раза в день — 5 дней", "Начинать через неделю болезни", "1 капсула раз в неделю", "Только для профилактики после выздоровления"], "correct": [0], "explain": "Тамифлю 75 мг: начать не позднее 2 дней с момента симптомов, по 1 капсуле 2 раза в день — 5 дней."}, {"id": "a6-10", "topic": 21, "pages": "76", "q": "Памятка: ограничения для Ринзы и Ибуклина при простуде?", "options": ["Не более 4 таблеток в сутки и не более 5 дней", "Не более 10 таблеток в сутки", "Без ограничений, это витамины", "Только 1 таблетка за весь курс"], "correct": [0], "explain": "Ринза или Ибуклин — по 1 таблетке 3–4 раза в день; максимальная суточная доза — 4 таблетки; не более 5 дней."}, {"id": "a6-11", "topic": 21, "pages": "77", "q": "Памятка: опоясывающий лишай (герпес). Что верно?", "options": ["Ацикловир 800 мг 5 раз в день — 7 дней", "Местно — зелёнка, Фукарцин или Бетадин", "Мочить и мазать кремами — нельзя", "При генитальном герпесе — те же местные антисептики на слизистые"], "correct": [0, 1, 2], "explain": "Ацикловир 800 мг 5 раз в день 7 дней (или Валвир) + витамины группы B, НПВС, антигистаминные, местно — зелёнка, Фукарцин или Бетадин; мочить и мазать кремами нельзя. При генитальном герпесе местные антисептики на слизистые наносить нельзя."}, {"id": "a6-12", "topic": 21, "pages": "77", "q": "Памятка: профилактика боррелиоза после укуса клеща?", "options": ["Доксициклин 100 мг 2 раза в день — 5 дней, место укуса обработать антисептиком", "Ацикловир 800 мг 5 раз в день", "Флуконазол 150 мг", "Ничего не нужно"], "correct": [0], "explain": "Профилактика боррелиоза, анаплазмоза, эрлихиоза: Доксициклин 100 мг 2 раза в день — 5 дней (можно заменить другим антибиотиком), местно — антисептик."}, {"id": "a6-13", "topic": 21, "pages": "77", "q": "Памятка: Флуконазол при молочнице (рот, половые органы)?", "options": ["150 мг через день — 2 приёма", "150 мг раз в неделю 6–12 месяцев", "150 мг каждый день месяц", "Флуконазол при молочнице не применяют"], "correct": [0], "explain": "Молочница — 150 мг через день, 2 приёма. Стопы — 150 мг раз в неделю 4–6 недель + Клотримазол крем. Ногти — 150 мг раз в неделю 6–12 месяцев."}, {"id": "a6-14", "topic": 21, "pages": "76", "q": "Памятка: что принимают при болях после ношения СИБЗ и фортификационных работ?", "options": ["Целекоксиб 200 мг + Мидокалм 150 мг — по 1 таблетке 2 раза в день совместно", "Промедол", "Нитроглицерин", "Только мазь Гепариновую"], "correct": [0], "explain": "После ношения СИБЗ и фортификационных работ — Целекоксиб 200 мг и Мидокалм 150 мг по 1 таблетке 2 раза в день совместно."}, {"id": "a6-15", "topic": 21, "pages": "78", "q": "Памятка: какой антибиотик основной при остром отите, синусите и бронхите?", "options": ["Амоксиклав 875/125 2 раза в сутки — 7 дней (альтернатива — Азитромицин или Левофлоксацин)", "Метронидазол 500 мг 3 раза в день", "Флуконазол 150 мг", "Доксициклин 100 мг однократно"], "correct": [0], "explain": "При остром среднем отите, риносинусите и бронхите — Амоксиклав 875/125 2 раза в сутки 7 дней; альтернативы — Азитромицин 500 мг раз в день 5 дней (отит, синусит) или Левофлоксацин 500 мг 2 раза в день."}, {"id": "a7-01", "topic": 22, "pages": "81", "q": "Какой документ приведён в конспекте в выдержках?", "options": ["Приказ Министра обороны РФ от 9 декабря 2022 г. № 760", "Приказ Минздрава № 477н", "Боевой устав сухопутных войск", "Федеральный закон об обороне"], "correct": [0], "explain": "В конспекте — выдержки из Приказа Министра обороны РФ от 9 декабря 2022 г. № 760: перечень состояний и мероприятий первой помощи военнослужащим."}, {"id": "a7-02", "topic": 22, "pages": "81", "q": "Какие состояния входят в перечень, при которых оказывается первая помощь военнослужащим?", "options": ["Отсутствие сознания", "Наружные кровотечения", "Острые психогенные реакции на стресс", "Хронический гастрит"], "correct": [0, 1, 2], "explain": "Перечень (13 пунктов): отсутствие сознания, остановка дыхания и кровообращения, наружные кровотечения, инородные тела дыхательных путей, травмы, ожоги, отморожения, отравления и БОВ, радиационные/химические/биологические факторы, оружие на новых физических принципах, укусы змей и насекомых, утопление, острые реакции боевого стресса."}, {"id": "a7-03", "topic": 22, "pages": "82", "q": "Где по приказу № 760 указывают время наложения кровоостанавливающего жгута?", "options": ["На коже лба раненого", "На подошве ботинка", "Только устно сообщают", "На каске"], "correct": [0], "explain": "Приказ: наложение штатного или импровизированного жгута «с указанием на коже лба раненого времени его наложения»."}, {"id": "a7-04", "topic": 22, "pages": "82", "q": "В каком порядке по приказу проводят подробный осмотр раненого?", "options": ["Голова, шея, грудь, живот, таз, спина, конечности", "Конечности, спина, таз, живот, грудь, голова", "Только видимые раны", "Живот, голова, конечности, спина"], "correct": [0], "explain": "Опрос раненого и подробный осмотр головы, шеи, груди, живота, таза, спины и конечностей — в указанном порядке."}, {"id": "a7-05", "topic": 22, "pages": "83", "q": "Обстановка угрожает жизни, раненый может передвигаться сам. Что он делает?", "options": ["Докладывает командиру подразделения о ранении", "Перемещается во временное укрытие", "Оказывает себе первоочередную помощь: жгут, обезболивающее, первичные повязки", "Остаётся на месте и ждёт медика"], "correct": [0, 1, 2], "explain": "Раненый докладывает командиру, перемещается в укрытие и выполняет первоочередные мероприятия самопомощи: жгут при обильном кровотечении из конечности, обезболивающее из аптечки, первичные повязки."}, {"id": "a7-06", "topic": 22, "pages": "83", "q": "По чьему приказу выполняется перемещение к раненому и вынос (эвакуация)?", "options": ["По приказу командира подразделения", "По решению самого оказывающего помощь", "По просьбе раненого", "По приказу медика батальона"], "correct": [0], "explain": "Оказывающий помощь докладывает командиру подразделения о раненом; перемещение к раненому, оказание помощи и вынос выполняются по приказу командира подразделения."}, {"id": "a7-07", "topic": 22, "pages": "83", "q": "Снимают ли с раненого средства защиты при оказании первой помощи?", "options": ["Не снимают, если обстановка угрожает его жизни", "Всегда снимают сразу", "Снимают только каску", "Снимают, если раненый без сознания"], "correct": [0], "explain": "П. 11: при оказании первой помощи средства защиты с раненого не снимаются, если сложившаяся обстановка угрожает его жизни."}, {"id": "a7-08", "topic": 22, "pages": "83–84", "q": "Правила выноса раненого по приказу № 760:", "options": ["Раненого выносят с его личным оружием", "Раненого без сознания выносят лицом вниз или на боку", "При невозможности выноса раненого оставляют в укрытии в положении на животе", "Оружие раненого оставляют на месте"], "correct": [0, 1, 2], "explain": "Вынос — с личным оружием; без сознания — лицом вниз или на боку; если вынос невозможен — раненый остаётся в укрытии на животе."}, {"id": "a7-09", "topic": 22, "pages": "84", "q": "Что устраняют в укрытии В ПЕРВУЮ очередь (состояния, способные убить за несколько минут)?", "options": ["Сильное наружное кровотечение, отсутствие сознания, отсутствие дыхания и нарушение проходимости дыхательных путей", "Переохлаждение и перелом таза", "Раны мягких тканей и слабое кровотечение", "Профилактику инфекции"], "correct": [0], "explain": "П. 16: сначала — состояния, ведущие к смерти за минуты. П. 17: затем — за десятки минут/часы (пневмоторакс, перелом шеи и таза, переохлаждение) + противошоковые меры. П. 18: раны и слабое кровотечение. П. 19: профилактика инфекции и подготовка к эвакуации."}, {"id": "a7-10", "topic": 22, "pages": "84", "q": "Какие состояния по приказу устраняют ВО ВТОРУЮ очередь (могут убить за десятки минут или часы)?", "options": ["Ранение груди с открытым или напряжённым пневмотораксом", "Перелом шейного отдела позвоночника и перелом костей таза", "Переохлаждение", "Сильное наружное кровотечение"], "correct": [0, 1, 2], "explain": "П. 17: открытый или напряжённый пневмоторакс, перелом шейного отдела позвоночника, перелом таза, переохлаждение; одновременно — противошоковые мероприятия. Сильное наружное кровотечение — в первую очередь (п. 16)."}, {"id": "a7-11", "topic": 22, "pages": "84", "q": "С каких мест по приказу № 760 запрещается снимать жгут, если с наложения прошло более 6 часов?", "options": ["С шеи и с ампутированных конечностей", "С любой конечности через 30 минут", "Только с руки", "Такого запрета нет"], "correct": [0], "explain": "П. 25: запрещается снимать жгут с шеи и ампутированных конечностей, если прошло более шести часов (конечность синюшная, отёчная, кожа уплотнена). П. 21: снимать или ослаблять жгут, находящийся на конечности более двух часов, тоже запрещено."}, {"id": "a7-12", "topic": 22, "pages": "82–83", "q": "Какие мероприятия по приказу выполняют только военнослужащие и медспециалисты, прошедшие специальную подготовку?", "options": ["Тугая тампонада раны или клипирование ран", "Внутривенный и внутрикостный доступ, инфузия кристаллоидов", "Декомпрессия при напряжённом пневмотораксе и установка назофарингеального воздуховода", "Наложение кровоостанавливающего жгута"], "correct": [0, 1, 2], "explain": "П. 2 Приложения № 2: подготовленные военнослужащие и медспециалисты выполняют тугую тампонаду или клипирование, в/в и внутрикостный доступ с инфузией, декомпрессию, назофарингеальный воздуховод, расширенную антибиотикопрофилактику. Жгут накладывает любой военнослужащий."}, {"id": "t01-01", "topic": 1, "pages": "3–4", "q": "Куда накладывают жгут/турникет в «красной» зоне (тактическое наложение)?", "options": ["Верхняя треть плеча, ближе к подмышке", "Верхняя треть бедра, ближе к паховой складке", "На коленный или локтевой сустав — там сосуды ближе к коже", "На предплечье или голень — ближе к ране"], "correct": [0, 1], "explain": "В «красной» зоне жгут накладывают максимально высоко и максимально туго: на руку — в верхнюю треть плеча ближе к подмышке, на ногу — в верхнюю треть бедра ближе к паховой складке. На суставы жгут не накладывают, а на предплечье и голень — только в отдельных случаях (травматическая ампутация без ранений выше)."}, {"id": "t01-02", "topic": 1, "pages": "3", "q": "Какая причина составляет большую часть (около 67%) смертей, которые можно предотвратить на передовых этапах помощи?", "options": ["Механическая травма (пневмо- и гемоторакс)", "Продолжающееся кровотечение", "Термическая травма", "Асфиксия"], "correct": [1], "explain": "По схеме на стр. 3: 67% — продолжающееся кровотечение, 17% — механическая травма, 7% — термическая, 3% — химическая, 1% — асфиксия. Поэтому остановка кровотечения — этап 1, и «пока не закончим, к следующему шагу не переходим»."}, {"id": "t01-03", "topic": 1, "pages": "3", "q": "Какие правила наложения жгута верны?", "options": ["Накладывать на одежду или ткань", "Накладывать на голое тело для лучшего прижатия", "Фиксировать жгут на два узла", "Прятать жгут под одеждой или снаряжением, чтобы он не зацепился"], "correct": [0, 2], "explain": "Жгут накладывают на одежду или ткань (на голое тело НЕЛЬЗЯ — травмируется кожа), фиксируют на два узла и оставляют на виду, не закрывая складками одежды или экипировкой."}, {"id": "t01-04", "topic": 1, "pages": "3", "q": "Как и где фиксируют время наложения жгута?", "options": ["В формате 24 часа", "На открытых участках тела раненого", "На самом жгуте", "Запоминают и сообщают устно при эвакуации"], "correct": [0, 1, 2], "explain": "Время наложения обязательно записывают в формате 24 часа на открытых участках тела или на самом жгуте. Отсутствие отметки о времени — одна из основных ошибок."}, {"id": "t01-05", "topic": 1, "pages": "3, 5", "q": "Если жгут находится на конечности непрерывно дольше какого времени, его ЗАПРЕЩЕНО снимать в полевых условиях?", "options": ["30 минут", "1 час", "2 часа", "4 часа"], "correct": [2], "explain": "Первые 60 минут функция конечности сохраняется, с 60 до 120 минут идёт нарушение функции и отмирание тканей. Жгут, который находится на конечности более 2 часов, в полевых условиях снимать и ослаблять запрещено."}, {"id": "t01-06", "topic": 1, "pages": "5", "q": "Почему жгут, который держится больше 2 часов, нельзя ослаблять?", "options": ["Токсины из тканей попадут в кровоток и убьют раненого", "Жгут к этому времени невозможно развязать", "Кровотечение после 2 часов останавливается само", "Это запрещено только из-за риска переохлаждения"], "correct": [0], "explain": "Без кровотока ткани не получают кислород, растёт число микроорганизмов, вырабатывающих токсины. Чем дольше наложен жгут, тем больше токсинов; если ослабить жгут после 2 часов, токсины попадут в кровоток и убьют раненого. Поэтому жгут нужно как можно быстрее заменить на давящую повязку и/или тугую тампонаду."}, {"id": "t01-07", "topic": 1, "pages": "5", "q": "Признаки правильно наложенного жгута/турникета:", "options": ["Кровь не течёт", "Конечность бледная", "Пульс на лучевой артерии/артерии стопы отсутствует", "Кожа ниже жгута багровая или фиолетовая"], "correct": [0, 1, 2], "explain": "Критерии правильности: кровь не течёт, конечность бледная, пульс на лучевой артерии или артерии стопы отсутствует. Багровый/фиолетовый цвет — признак ошибки."}, {"id": "t01-08", "topic": 1, "pages": "5", "q": "Кожа ниже жгута стала багровой/фиолетовой. Что это значит?", "options": ["Жгут наложен правильно", "Жгут перекрыл венозный, а не артериальный кровоток", "Это нормальная реакция на холод", "Это признак аллергии на материал жгута"], "correct": [1], "explain": "Багровый/пурпурный/фиолетовый цвет означает, что перекрыт только венозный кровоток: кровь поступает в конечность, а отток затруднён. Возникает отёк, ведущий к некрозу, и усиливается наружное венозное кровотечение. Нужна достаточная компрессия."}, {"id": "t01-09", "topic": 1, "pages": "5", "q": "Что из перечисленного относится к основным ошибкам при наложении жгута?", "options": ["Не указано время наложения", "Жгут наложен при незначительном кровотечении", "Жгут наложен поверх предметов в карманах или элементов снаряжения", "Жгут наложен максимально высоко на конечности"], "correct": [0, 1, 2], "explain": "Основные ошибки: нет времени наложения; жгут при незначительном кровотечении (нужна давящая повязка); несоблюдение сроков; наложение поверх предметов в карманах и снаряжения; неверное место; недостаточная компрессия. Наложение максимально высоко в «красной» зоне — правило, а не ошибка."}, {"id": "t01-10", "topic": 1, "pages": "4", "q": "Как перемещают жгут ближе к ране после осмотра в «жёлтой» или «зелёной» зоне?", "options": ["Новый турникет накладывают на 8–10 см (ширина ладони) выше раны", "Первоначальный жгут снимают и убирают в аптечку", "Первоначальный жгут ослабляют, но оставляют на конечности", "Записывают новое время наложения"], "correct": [0, 2], "explain": "Порядок: затянуть турникет на 8–10 см выше раны; ослабить первоначальный жгут и оставить его на конечности; наблюдать за кровотечением и при обильном кровотечении снова затянуть первоначальный жгут. Время наложения оставляют прежним."}, {"id": "t01-11", "topic": 1, "pages": "5", "q": "Как выполняется пальцевое прижатие бедренной артерии при ранении средней и нижней трети бедра?", "options": ["Кулаком в паховой области к лобковой кости", "Большим пальцем в подколенной ямке", "Ладонью к бедренной кости над коленом", "Двумя пальцами к тазобедренному суставу сбоку"], "correct": [0], "explain": "Бедренную артерию прижимают кулаком в паховой области к лобковой кости. Пальцевое прижатие — временная мера, пока готовят средства остановки кровотечения."}, {"id": "t01-12", "topic": 1, "pages": "6", "q": "Как остановить кровотечение в «неудобных» областях (пах, подмышка, шея)?", "options": ["Прижать к ране нераспакованный ППИ и притянуть его жгутом с 1–2 перекрутами над ним", "При ранении шеи тампонировать рану прямо под ППИ, не снимая его", "При ранении шеи наложить жгут вокруг шеи", "Ничего не делать до эвакуации — эти области жгутом не пережать"], "correct": [0, 1], "explain": "Нераспакованный ППИ прижимают к ране и притягивают жгутом, делая над ним 1–2 перекрута; под жгут можно подложить ещё ППИ, магазин, бутылку. При первой возможности заменяют на тугую тампонаду и/или давящую повязку. При ранении шеи тампонируют прямо под ППИ, не снимая его, чтобы избежать быстрой потери крови."}, {"id": "t02-01", "topic": 2, "pages": "7", "q": "Ротоглотка раненого забита рвотными массами, землёй, обломками зубов. Как правильно её очистить?", "options": ["Повернуть голову набок", "Поместить палец снаружи в щёку между челюстями, чтобы раненый не укусил", "Глубоко засунуть пальцы в глотку, даже если не видно, что там", "Вычищать пальцами в перчатках или обмотанными тряпкой"], "correct": [0, 1, 3], "explain": "Голову поворачивают набок, палец помещают снаружи в щёку между челюстями (на случай укуса) и вычищают пальцами в перчатках или обмотанными тряпкой. Пальцы в ротоглотку вслепую не засовывают — можно перекрыть дыхательные пути."}, {"id": "t02-02", "topic": 2, "pages": "7", "q": "Как проверить дыхание после запрокидывания головы и выдвижения подбородка?", "options": ["Приложить ухо и щёку ко рту раненого, положив руку ему на живот", "Посчитать пульс на запястье", "Посмотреть на цвет ногтей", "Резко надавить на грудину"], "correct": [0], "explain": "Прикладывают ухо и щёку ко рту пострадавшего и одновременно кладут руку на живот, чтобы почувствовать его подъём."}, {"id": "t02-03", "topic": 2, "pages": "7–8", "q": "Когда воздуховод Гведела (ротовой) ставить НЕЛЬЗЯ?", "options": ["Раненый в сознании", "Обширные ранения полости рта", "Раненый без сознания, лежит на спине", "У раненого перелом таза и его нельзя положить на бок"], "correct": [0, 1], "explain": "Противопоказания: раненый в сознании (вызовет рвоту) и обширные ранения полости рта. Раненый без сознания на спине — это как раз показание; перелом таза или позвоночника, при котором нельзя придать устойчивое боковое положение, — повод использовать воздуховод."}, {"id": "t02-04", "topic": 2, "pages": "8", "q": "Как подобрать размер ротового воздуховода (Гведела)?", "options": ["По расстоянию от угла нижней челюсти до передних резцов", "По длине ладони раненого", "По ширине рта раненого", "Размер у всех одинаковый"], "correct": [0], "explain": "Размер подбирается индивидуально по принципу «от твёрдого к твёрдому»: расстояние от угла нижней челюсти до передних резцов."}, {"id": "t02-05", "topic": 2, "pages": "8", "q": "Как вводят воздуховод Гведела?", "options": ["Изогнутым концом к верхнему нёбу, после упора разворачивают на 180° и продвигают до конца", "Изогнутым концом к языку, без разворота", "Изогнутым концом к нёбу, разворачивают на 90°", "Через нос до упора"], "correct": [0], "explain": "Раненому на спине выдвигают нижнюю челюсть, вводят воздуховод изогнутым концом к верхнему нёбу, после упора разворачивают на 180° и продвигают до конца, затем фиксируют бинтом вокруг головы за муфту."}, {"id": "t02-06", "topic": 2, "pages": "8", "q": "Что верно для назофарингеального (носового) воздуховода?", "options": ["Его можно ставить раненому в сознании", "Скошенный край поворачивают к носовой перегородке", "Если трубка не идёт — надавить сильнее", "Его ставят при значительных травмах носа"], "correct": [0, 1], "explain": "Носовой воздуховод можно ставить раненому в сознании и при значительных травмах челюстно-лицевой области; скошенный край — к носовой перегородке. Если что-то мешает, не давить, а вынуть трубку и попробовать через другую ноздрю. Противопоказание — значительные травмы носа."}, {"id": "t02-07", "topic": 2, "pages": "9", "q": "Какие параметры сердечно-лёгочной реанимации верны?", "options": ["Частота нажатий 100–120 в минуту", "Глубина компрессии грудины 5–8 см", "15 нажатий на 2 вдоха", "Прерывать компрессии можно до 30 секунд"], "correct": [0, 1], "explain": "Нажатия с частотой 100–120 в минуту на глубину 5–8 см; после 30 нажатий — 2 выдоха. Прерывание компрессии более чем на 10 секунд недопустимо."}, {"id": "t02-08", "topic": 2, "pages": "9", "q": "Какие признаки относятся к признакам биологической смерти?", "options": ["Симптом «кошачьего глаза» — зрачок вытягивается при надавливании сбоку", "Высыхание и помутнение роговицы", "Трупные пятна", "Бледность кожи и холодный пот"], "correct": [0, 1, 2], "explain": "Признаки биологической смерти: нет дыхания и пульса на сонной артерии; широкие зрачки без реакции на свет, симптом «кошачьего глаза» (может появиться уже через 10–15 минут); температура тела ниже 20 градусов; высыхание и помутнение роговицы; трупные пятна (смерть более получаса назад)."}, {"id": "t03-01", "topic": 3, "pages": "10", "q": "Симптомы открытого пневмоторакса:", "options": ["Частое поверхностное («собачье») дыхание", "Шумное всасывание воздуха в грудную полость", "Вспененная кровь, просачивающаяся через рану", "Редкое глубокое спокойное дыхание"], "correct": [0, 1, 2], "explain": "Симптомы: частое поверхностное дыхание, сильная боль в области дефекта (раненый закрывает его рукой или весом тела), шумное всасывание воздуха, вспененная кровь из раны, попытки сесть или поза эмбриона."}, {"id": "t03-02", "topic": 3, "pages": "10", "q": "Чем закрывают ВХОДНОЕ отверстие при открытом пневмотораксе?", "options": ["Окклюзионным пластырем с клапаном, клапан — прямо на рану", "Глухим окклюзионным пластырем", "Обычной ватно-марлевой повязкой", "Не закрывают, чтобы воздух выходил"], "correct": [0], "explain": "Входное отверстие закрывают окклюзионным пластырем с клапаном, размещая клапан непосредственно на раневое отверстие. Выходное — глухим окклюзионным пластырем."}, {"id": "t03-03", "topic": 3, "pages": "10", "q": "Ранение грудной клетки слепое — есть только входное отверстие. Какой пластырь клеить?", "options": ["Обязательно пластырь с клапаном", "Глухой окклюзионный пластырь", "Любой — разницы нет", "Никакой, только давящую повязку"], "correct": [0], "explain": "При единственном (слепом) ранении обязательно клеят пластырь с клапаном, чтобы не спровоцировать напряжённый (закрытый) пневмоторакс."}, {"id": "t03-04", "topic": 3, "pages": "10", "q": "Окклюзионного пластыря нет, используется упаковка ППИ. Как её закрепить?", "options": ["На входном отверстии — скотчем П-образно, нижний край открыт", "На выходном отверстии — скотчем с четырёх сторон", "На входном отверстии — скотчем с четырёх сторон", "На выходном отверстии — П-образно, нижний край открыт"], "correct": [0, 1], "explain": "Вход: упаковка ППИ приклеивается скотчем П-образно с открытым нижним краем (работает как клапан). Выход: упаковка ППИ заклеивается скотчем с четырёх сторон (как глухой пластырь)."}, {"id": "t03-05", "topic": 3, "pages": "11", "q": "Какие симптомы характерны для закрытого пневмоторакса?", "options": ["Набухание вен на шее", "Похрустывание под кожей (как снег) на груди под ключицей", "Отсутствие подвижности грудной клетки на раненой стороне", "Видимая рана грудной клетки со вспененной кровью"], "correct": [0, 1, 2], "explain": "При закрытом пневмотораксе снаружи раны нет. Симптомы: приступообразный кашель, колющая боль в груди, паника, бульканье и одышка, неподвижность грудной клетки на раненой стороне, синюшность, набухание вен на шее, похрустывание под кожей под ключицей."}, {"id": "t03-06", "topic": 3, "pages": "11", "q": "В каком положении транспортируют раненого с закрытым пневмотораксом?", "options": ["Полусидя", "Лёжа на спине", "Лёжа на животе", "С приподнятыми ногами, голова ниже"], "correct": [0], "explain": "Транспортировка исключительно полусидя, чтобы кровь стекала в нижнюю часть и не скапливалась в плевральной полости (гемоторакс)."}, {"id": "t03-07", "topic": 3, "pages": "12", "q": "Декомпрессия при напряжённом пневмотораксе (для военнослужащих со спецподготовкой). Что верно?", "options": ["Игла 10G, при отсутствии — внутривенный катетер 16G", "Место прокола — второе межреберье по среднеключичной линии, по верху третьего ребра", "Иглу вводят под углом 45° на глубину 8–10 см", "Прокол делают в положении раненого лёжа на животе"], "correct": [0, 1], "explain": "Декомпрессионная игла 10G или катетер 16G; место — впадина между 2-м и 3-м ребром по середине ключицы, прокол по верху третьего ребра под 90° на глубину 3–4 см; раненый — в положении сидя. Проводится только в крайнем случае: вздулись яремные вены, гортань сместилась в здоровую сторону."}, {"id": "t01-13", "topic": 1, "pages": "3", "q": "Какие методы остановки кровотечения перечислены в конспекте?", "options": ["Жгутование", "Давящая повязка", "Прямое давление на рану и тампонада", "Ожидание, пока кровь свернётся сама"], "correct": [0, 1, 2], "explain": "Методы: жгутование, давящие повязки, прямое давление на рану, тампонада, введение препаратов. Пока кровотечение не остановлено, к следующему шагу не переходят."}, {"id": "t01-14", "topic": 1, "pages": "4", "q": "Почему жгут в «красной» зоне накладывают именно в верхней трети плеча или бедра?", "options": ["Там сосуды ближе всего к поверхности, хорошо прижимаются к костям и обжимаются мышцами", "Там меньше всего нервов", "Там жгут не виден противнику", "Так требует только инструкция к турникету"], "correct": [0], "explain": "В этих анатомических областях сосуды расположены наиболее близко к поверхности, хорошо прижимаются к костям и обжимаются мышцами — поэтому жгут надёжно останавливает кровотечение."}, {"id": "t01-15", "topic": 1, "pages": "4", "q": "Когда допустимо наложить жгут на предплечье или голень?", "options": ["При травматической ампутации и отсутствии ранений выше места наложения", "Всегда — так ближе к ране", "Только если нет турникета, а есть жгут Эсмарха", "Никогда"], "correct": [0], "explain": "Наложение на предплечье и голень допустимо только в отдельных случаях: при травматической ампутации и отсутствии ранений выше места наложения жгута."}, {"id": "t01-16", "topic": 1, "pages": "6", "q": "Как подготовить жгут Эсмарха к использованию?", "options": ["Убрать кнопки и отрезать концы с отверстиями для кнопок", "Сложить гармошкой по длине ладони", "Перетянуть резинкой для денег", "Хранить в заводской упаковке до момента применения"], "correct": [0, 1, 2], "explain": "Жгут вынимают из упаковки, убирают кнопки, отрезают концы с отверстиями, протягивают по всей длине двумя руками, складывают гармошкой по длине ладони и перетягивают резинкой для денег."}, {"id": "t01-17", "topic": 1, "pages": "6", "q": "Какой необходимый минимум жгутов/турникетов на бойце указан в конспекте?", "options": ["2 штуки", "3 штуки", "5 штук: 2 на снаряжении, 2 на поясе, 1 в кармане боевых штанов", "7 штук"], "correct": [2], "explain": "Необходимый минимум: 2 на снаряжении, 2 на поясе (он обычно всегда надет), 1 в кармане боевых штанов — всего 5."}, {"id": "t01-18", "topic": 1, "pages": "6", "q": "Правила размещения жгутов и турникетов:", "options": ["Чтобы быстро достать в любом положении любой рукой", "В идеале у всего взвода одинаковое расположение средств первой помощи", "Боевыми жгутами можно тренироваться, чтобы привыкнуть к ним", "Лучше всего хранить жгут на дне рюкзака"], "correct": [0, 1], "explain": "Жгуты размещают так, чтобы быстро достать любой рукой в любом положении: на груди в «треугольнике жизни», на поясе спереди, на лямке плитника. В идеале расположение одинаково у всего взвода. Боевые жгуты для тренировок использовать НЕЛЬЗЯ."}, {"id": "t02-09", "topic": 2, "pages": "7", "q": "Раненый был в зоне задымления. Что верно?", "options": ["Ингаляционная травма (ожог дыхательных путей) предполагается всегда", "Для расширения бронхов применяют Эуфиллин в/в медленно (4–6 минут), разведя в NaCl", "При геморрагическом шоке Эуфиллин вводить только после восполнения ОЦК", "Эуфиллин вводят быстро, струйно"], "correct": [0, 1, 2], "explain": "После задымления ингаляционная травма предполагается всегда — опасны отёк лёгких и сужение бронхов. Эуфиллин 24 мг/мл 10 мл разводят в 10 мл 0,9% NaCl и вводят в/в медленно 4–6 минут. При геморрагическом шоке ЗАПРЕЩЕНО до восполнения объёма жидкости."}, {"id": "t02-10", "topic": 2, "pages": "7", "q": "Зачем раненого без сознания переводят в устойчивое боковое положение?", "options": ["Чтобы он не задохнулся из-за западения языка", "Чтобы легче было наложить жгут", "Чтобы быстрее поднялось давление", "Чтобы согреть его"], "correct": [0], "explain": "Раненого без сознания переводят в устойчивое боковое положение, чтобы он не задохнулся из-за западения языка. Если это невозможно (перелом таза, позвоночника), используют воздуховод."}, {"id": "t02-11", "topic": 2, "pages": "9", "q": "Где находится точка компрессии при СЛР?", "options": ["На два пальца выше места схождения рёбер у основания мечевидного отростка", "Слева над соском", "В середине живота", "В верхней трети грудины у ключиц"], "correct": [0], "explain": "Точку находят, отложив два пальца вверх от места схождения рёбер у основания мечевидного отростка. Давят двумя ладонями в замок, прямыми руками, под углом 90 градусов."}, {"id": "t02-12", "topic": 2, "pages": "9", "q": "В каких случаях СЛР завершают?", "options": ["Через 30 минут без результата", "Возникла опасность для оказывающего помощь", "Появился новый (перспективный) раненый", "Через 5 минут без результата"], "correct": [0, 1, 2], "explain": "СЛР завершают: появились признаки жизни (после пульса — ещё 3 цикла), устойчивое дыхание, 30 минут без результата, опасность для помогающего, его истощение, пришли более подготовленные специалисты, появился перспективный раненый, признаки биологической смерти."}, {"id": "t03-08", "topic": 3, "pages": "10", "q": "Что такое пневмоторакс?", "options": ["Скопление воздуха в плевральной полости из-за повреждения оболочки лёгкого", "Скопление крови в брюшной полости", "Отёк лёгких после задымления", "Перелом рёбер без повреждения лёгкого"], "correct": [0], "explain": "Пневмоторакс — скопление воздуха в плевральной полости в результате повреждения внешней оболочки лёгкого. Без помощи воздух давит на лёгкое и сердце, развивается напряжённый пневмоторакс и остановка сердца."}, {"id": "t03-09", "topic": 3, "pages": "11", "q": "Что такое гемоторакс и как он устраняется?", "options": ["Скопление крови в плевральной полости; устраняется хирургически — раненого скорее доставить к хирургу", "Скопление воздуха под кожей; проходит само", "Скопление крови в плевральной полости; устраняется окклюзионным пластырем", "Перелом грудины; устраняется шиной"], "correct": [0], "explain": "Гемоторакс — скопление крови в плевральной полости; приводит к тем же последствиям, что пневмоторакс, но позже. Устраняется хирургическим вмешательством, поэтому раненого нужно как можно скорее доставить к хирургу (транспортировка полусидя)."}, {"id": "t03-10", "topic": 3, "pages": "12", "q": "При каких признаках допустима декомпрессия иглой (только в крайнем случае)?", "options": ["Вздулись яремные вены на шее", "Гортань заметно сместилась в сторону здорового лёгкого", "При любом ранении грудной клетки", "При приступообразном кашле"], "correct": [0, 1], "explain": "Декомпрессия допустима только в самом крайнем случае: у раненого вздулись яремные вены на шее, гортань видимо сместилась в сторону здорового лёгкого. Если после прокола лёгкое расправилось и заткнуло катетер — повернуть катетер на четверть оборота или потянуть на 3–5 мм."}, {"id": "t04-08", "topic": 4, "pages": "15", "q": "Как правильно сочетать препараты для усиления обезболивания (чтобы обойтись без наркотических)?", "options": ["Нефопам + Кетопрофен — в одном шприце 5 мл, только в/м глубоко медленно", "Мелоксикам + Анальгин — в/м отдельными шприцами", "Мелоксикам + Анальгин — смешать в одном шприце", "Нефопам + Кетопрофен — в/в струйно"], "correct": [0, 1], "explain": "Вариант а) Нефопам 20 мг + Кетопрофен 100 мг в шприце 5 мл, только в/м глубоко медленно; вариант б) Мелоксикам 15 мг + Анальгин 1000 мг в/м отдельными шприцами — в одном не смешивать."}, {"id": "t04-09", "topic": 4, "pages": "15", "q": "Что применяют при тошноте и рвоте как побочной реакции на обезболивающее?", "options": ["Ондансетрон или Метоклопрамид", "Налоксон", "Кеторолак", "Транексамовую кислоту"], "correct": [0], "explain": "Для профилактики и лечения тошноты/рвоты: Ондансетрон 4 мг в/м медленно или в/в не менее 30 секунд, либо Метоклопрамид 10 мг в/м или в/в медленно 2–3 минуты."}, {"id": "t05-05", "topic": 5, "pages": "16", "q": "Почему внутривенный доступ лучше обеспечить как можно раньше после ранения?", "options": ["Вены постепенно спадаются, и установка станет невозможной", "Чтобы быстрее ввести Промедол", "Так меньше боль от укола", "Через час катетер перестаёт работать"], "correct": [0], "explain": "Процедуру лучше выполнять как можно раньше: вены постепенно спадаются, и установка катетера станет невозможной."}, {"id": "t05-06", "topic": 5, "pages": "17", "q": "Зачем после подключения капельницы формируют «транспортную петлю»?", "options": ["Чтобы катетер не выдернулся при транспортировке", "Чтобы раствор капал быстрее", "Чтобы раствор согревался", "Чтобы удобнее было снять систему"], "correct": [0], "explain": "«Транспортная петля» из трубки системы, закреплённая бинтом, предотвращает выдёргивание катетера при транспортировке раненого."}, {"id": "t06-11", "topic": 6, "pages": "19", "q": "Признаки тяжёлой кровопотери (30–40% ОЦК):", "options": ["Спутанность сознания", "Пульс более 120 ударов в минуту", "Холодные конечности", "Повышение артериального давления"], "correct": [0, 1, 2], "explain": "Признаки тяжёлой кровопотери: выраженная бледность, спутанность сознания, пульс более 120, значительное ПАДЕНИЕ давления, одышка, холодные конечности."}, {"id": "t06-12", "topic": 6, "pages": "19", "q": "Какие повреждения ОЧЕНЬ часто сопровождаются шоком?", "options": ["Перелом двух и более трубчатых костей", "Перелом костей таза", "Проникающие ранения груди, живота, таза", "Ранение пальца кисти"], "correct": [0, 1, 2], "explain": "Часто сопровождаются шоком: перелом двух и более трубчатых костей, перелом таза, ранения конечностей выше локтевого и коленного суставов, повреждения позвоночника с параличами, ампутации выше голеностопного и лучезапястного суставов, проникающие ранения груди, живота, таза."}, {"id": "t06-13", "topic": 6, "pages": "24–25", "q": "Под каким углом вводят иглу при разных видах инъекций?", "options": ["Внутримышечно — 90 градусов", "Подкожно — 45 градусов, в складку кожи", "Внутривенно — 15–25 градусов", "Подкожно — 90 градусов на всю длину иглы"], "correct": [0, 1, 2], "explain": "Подкожно: кожу собирают в складку, иглу вводят срезом вверх под 45° на 15 мм. Внутримышечно: под 90° на 2/3 длины иглы. Внутривенно: срезом вверх под 15–25° на 1/3 длины иглы."}, {"id": "t06-14", "topic": 6, "pages": "25", "q": "Гипогликемия (снижение сахара в крови). Что делать?", "options": ["Глюкоза 40% — 1 ампула 10 мл только в/в медленно; если нет — дать пососать сладкое", "Ввести Промедол", "Ввести Фуросемид", "Глюкозу 40% ввести внутримышечно"], "correct": [0], "explain": "Гипогликемия (<3,5 ммоль) возникает при резком выбросе адреналина или переутомлении, особенно у диабетиков: голод, тремор, потливость, сердцебиение, дезориентация. Помощь — Глюкоза 40% 10 мл только в/в медленно, при отсутствии — что-нибудь сладкое (кусочек сахара)."}, {"id": "t06-15", "topic": 6, "pages": "25–26", "q": "Помощь при анафилактическом шоке:", "options": ["Устранить контакт с аллергеном, наложить жгут выше места введения, приложить холод", "При отсутствии рвоты — уложить на спину с приподнятыми ногами", "Ввести Дексаметазон 20 мг или Преднизолон 120 мг в/в", "Ввести Промедол для снятия зуда"], "correct": [0, 1, 2], "explain": "Порядок: убрать аллерген, жгут выше места введения, холод; обеспечить дыхание; при рвоте — на бок, без рвоты — на спину с поднятыми ногами; венозный доступ; снять жгут; Адреналин или Норэпинефрин в/в по 2 мл раствора каждые 3 минуты до пульса на лучевой; NaCl 0,9% не менее 1 л; Дексаметазон 20 мг или Преднизолон 120 мг. Быть готовым к СЛР."}, {"id": "t06-16", "topic": 6, "pages": "27", "q": "Химические ожоги. Чем обрабатывают после промывания водой?", "options": ["Ожог кислотой — 2% раствором питьевой соды или мыльной водой", "Ожог щёлочью — 2% раствором борной кислоты, лимонной кислотой или столовым уксусом", "Ожог кислотой — столовым уксусом", "Ожог щёлочью — раствором питьевой соды"], "correct": [0, 1], "explain": "Кислоту нейтрализуют щелочным раствором: после воды — 2% сода или мыльная вода, сухая повязка. Щёлочь — кислым: 2% борная кислота, лимонная кислота или уксус, сухая повязка. При поражении фосфором — 5% сульфат меди, затем 5–10% сода."}, {"id": "t04-01", "topic": 4, "pages": "13", "q": "Что означает боль 9–10 баллов по визуально-аналоговой шкале (ВАШ)?", "options": ["Боль мешает разговаривать; требуется наркотическое обезболивание (при отсутствии ранений груди и ЧМТ)", "Человек не может спать и читать; достаточно таблетки", "Умеренная боль, обезболивание по необходимости", "Боли почти нет"], "correct": [0], "explain": "9–10 баллов — боль препятствует речевой коммуникации, требуется медикаментозное (наркотическое) обезболивание при отсутствии ранений грудной клетки и ЧМТ. Невыносимая боль ухудшает состояние и может привести к шоку, поэтому обезболивать нужно как можно раньше."}, {"id": "t04-02", "topic": 4, "pages": "13", "q": "Что обязательно сделать при обезболивании раненого?", "options": ["Перед введением определить, нет ли ЧМТ и травмы грудной клетки", "Если раненый в сознании — уточнить аллергию на лекарства", "Записать время, название препарата и дозу (например, «22:35 НФП 1 шт»)", "Выбросить использованную ампулу или шприц-тюбик, чтобы не мешали"], "correct": [0, 1, 2], "explain": "При ЧМТ и травме груди противопоказаны наркотические обезболивающие. Нужно уточнить аллергию, записать время, препарат и дозу, а ампулу или шприц-тюбик закрепить на одежде бойца."}, {"id": "t04-03", "topic": 4, "pages": "14", "q": "Как правильно применить шприц-тюбик?", "options": ["Повернуть канюлю по часовой стрелке 2 раза, держась за ребристый ободок и тело тюбика", "Колоть в здоровую конечность — плечо или наружную верхнюю треть бедра", "Через одежду колоть нельзя — только в голую кожу", "После нажатия на тюбик разжать пальцы, затем вытащить иглу"], "correct": [0, 1], "explain": "Канюлю поворачивают по часовой стрелке 2 раза, снимают колпачок, колют в здоровую конечность под 90°; через одежду вводить допустимо (без предметов в карманах и швов в месте укола). На тюбик нажимают до конца и вынимают иглу, НЕ РАЗЖИМАЯ пальцы."}, {"id": "t04-04", "topic": 4, "pages": "14, 26", "q": "Что верно о Промедоле (20 мг/мл, 1 мл в/м)?", "options": ["Не вводится при ЧМТ и ранении лёгких — угнетает дыхание", "Повторно — не ранее чем через 4 часа, не более 4 раз в сутки", "Начинает действовать через 1–2 минуты", "Это препарат выбора при контузии"], "correct": [0, 1], "explain": "Промедол — наркотическое обезболивающее; не вводится при ЧМТ и ранении лёгких, контуженному категорически противопоказан. Действует через 10–15 минут, 3–4 часа; повтор не ранее чем через 4 часа, не более 4 раз в сутки."}, {"id": "t04-06", "topic": 4, "pages": "15, 26", "q": "Какой обезболивающий препарат — препарат выбора при контузии?", "options": ["Кеторолак 30 мг (1 ампула по 1 мл)", "Промедол", "Налоксон", "Ондансетрон"], "correct": [0], "explain": "При контузии препарат выбора — Кеторолак 30 мг/мл 30 мг (1 ампула по 1 мл) в/м глубоко медленно или в/в не менее 15 секунд. Промедол контуженному противопоказан. Налоксон — антидот при передозировке опиоидов, Ондансетрон — от тошноты."}, {"id": "t05-01", "topic": 5, "pages": "16", "q": "Приоритетные места установки внутривенного катетера:", "options": ["Тыл кисти", "Локтевой сгиб", "Шея", "Тыл стопы"], "correct": [0, 1], "explain": "Приоритетные точки — тыл кисти и локтевой сгиб. Если не получается на локтевом сгибе, допускается вена на кисти (иногда это даже предпочтительнее). Ставить катетер лучше как можно раньше — вены постепенно спадаются."}, {"id": "t05-02", "topic": 5, "pages": "16", "q": "Что верно при введении иглы-проводника катетера?", "options": ["Иглу вводят под углом 15 градусов", "В одну вену — до 3 попыток", "После появления капли крови в индикаторной камере продвинуть иглу ещё на 2–3 мм", "Иглу продвигают, пока она не пройдёт вену насквозь"], "correct": [0, 1, 2], "explain": "Кожу натягивают, иглу вводят под 15° до чувства провала (около 1 см). Капля крови в индикаторной камере — игла в вене; продвинуть ещё на 2–3 мм, не проходя вену насквозь. Попыток в одну вену — до 3."}, {"id": "t05-03", "topic": 5, "pages": "17", "q": "Зачем перед подключением капельницы промывают катетер 10 мл кристаллоида?", "options": ["Чтобы прочистить трубку от свернувшейся крови — иначе система не будет капать", "Чтобы обезболить место прокола", "Чтобы проверить аллергию на раствор", "Чтобы согреть вену"], "correct": [0], "explain": "Катетер промывают через верхний или основной порт 10 мл любого кристаллоида под давлением шприцем, чтобы убрать затромбированную кровь; иначе система капать не будет. Затем формируют «транспортную петлю» и закрепляют бинтом."}, {"id": "t05-04", "topic": 5, "pages": "17", "q": "Что верно о размерах внутривенных катетеров?", "options": ["Чем больше число G, тем меньше диаметр иглы", "16G — самый большой, серого цвета", "20G — самый большой, через него быстрее всего вводить", "18G — розового цвета"], "correct": [0, 1], "explain": "Чем больше цифра, тем тоньше игла. 16G — серый (1,8 мм, 200 мл/мин), самый большой, но может порвать узкую вену; 18G — зелёный (95 мл/мин); 20G — розовый (65 мл/мин)."}, {"id": "t06-01", "topic": 6, "pages": "18", "q": "Симптомы геморрагического шока:", "options": ["Кожа холодная, бледная, влажная (липкий пот)", "Дыхание чаще 30 раз в минуту", "Капиллярное наполнение на мизинце дольше 3 секунд", "Пульс на сонной артерии реже 60 ударов в минуту"], "correct": [0, 1, 2], "explain": "Симптомы: холодная бледная влажная кожа, дыхание >30 в минуту, нет пульса на лучевой артерии, капиллярное наполнение на мизинце >3 секунд, пульс на сонной артерии БОЛЕЕ 110 в минуту, цианоз носогубного треугольника. При этих признаках показана срочная инфузионная терапия."}, {"id": "t06-02", "topic": 6, "pages": "19", "q": "Пульс на лучевой артерии не определяется. Что это означает?", "options": ["Верхнее давление ниже 90 мм рт. ст. — гемодинамика нестабильна (шок)", "Давление в норме, просто плохо прощупывается", "Верхнее давление выше 120 мм рт. ст.", "Это признак только переохлаждения"], "correct": [0], "explain": "Отсутствие пульса на лучевой артерии означает, что верхнее давление ниже 90 мм рт. ст. — это нестабильная гемодинамика, то есть шок. Если нет пульса и на сонной артерии, верхнее давление однозначно ниже 60 мм рт. ст."}, {"id": "t06-03", "topic": 6, "pages": "19", "q": "Пульс на лучевой артерии есть. Что верно?", "options": ["Это полностью исключает геморрагический шок", "Нужно измерить частоту пульса на сонной артерии", "Пульс чаще 110 ударов в минуту при травме говорит о шоке", "Отношение ЧСС к верхнему давлению больше 1 при травме говорит о шоке"], "correct": [1, 2, 3], "explain": "Пульс на лучевой артерии не исключает шок. Частоту замеряют на сонной артерии: при ЧСС более 110 или при отношении ЧСС/АД верхнее больше 1 (например, 110/80) на фоне травм можно говорить о геморрагическом шоке."}, {"id": "t06-04", "topic": 6, "pages": "20–21", "q": "Базовые правила инфузионной терапии на догоспитальном этапе:", "options": ["Общий объём растворов — не более 1,5 литра", "Растворы должны быть тёплыми — 37–40 °C", "Чем больше раствора, тем лучше — объём не ограничен", "Растворы лучше вводить холодными, чтобы сузить сосуды"], "correct": [0, 1], "explain": "Объём — до 1,5 л: растворы разбавляют кровь и ухудшают её свёртывание и перенос кислорода. Переливают только тёплые растворы 37–40 °C: холодные вызывают распад эритроцитов, снижение свёртываемости и могут спровоцировать нарушения ритма вплоть до остановки сердца."}, {"id": "t06-05", "topic": 6, "pages": "20", "q": "Какое верхнее давление поддерживают при инфузии («управляемая гипотония»)?", "options": ["Чуть выше 90 мм рт. ст. (до появления пульса на лучевой артерии)", "При ЧМТ — 100–110 мм рт. ст.", "Как можно выше, 130–140 мм рт. ст.", "При ЧМТ — ниже 80 мм рт. ст."], "correct": [0, 1], "explain": "Поддерживают верхнее давление чуть выше 90 мм рт. ст., затем инфузию прекращают: давление выше 90–100 может усилить кровотечение (особенно внутригрудное, внутрибрюшное, внутритазовое). При ЧМТ держат 100–110 мм рт. ст., чтобы спасти головной мозг."}, {"id": "t06-06", "topic": 6, "pages": "21, 23", "q": "Что верно о кристаллоидах и коллоидах?", "options": ["Соотношение кристаллоидов и коллоидов — 2:1", "Из коллоидов предпочтение — Гелофузину", "При ожогах и обморожениях инфузию начинают с коллоидов", "Соотношение кристаллоидов и коллоидов — 1:2"], "correct": [0, 1], "explain": "Соотношение кристаллоидов и коллоидов 2:1; через 20–30 минут без коллоида в сосудах остаётся не более 25% кристаллоида. Из коллоидов предпочтителен Гелофузин. При ожогах и обморожениях начинают с кристаллоидов, а не коллоидов, — для защиты почек."}, {"id": "t06-07", "topic": 6, "pages": "22", "q": "Какой порядок базовой инфузионной терапии при геморрагическом шоке?", "options": ["Восполнение ОЦК → гемостатик → гормоны → обезболивание → противорвотное → коллоиды → поддержание давления", "Поддержание давления → обезболивание → восполнение ОЦК → гемостатик", "Гормоны → коллоиды → восполнение ОЦК → гемостатик
