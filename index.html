→ обезболивание", "Обезболивание → противорвотное → поддержание давления → восполнение ОЦК"], "correct": [0], "explain": "Порядок: восполнение ОЦК (кристаллоиды) → гемостатик (ТНК) → гормоны (Дексаметазон) → обезболивание (Нефопам) → противорвотное (Ондансетрон) → дополнительно коллоиды → поддержание давления. Катетеризация и инфузия не должны задерживать эвакуацию."}, {"id": "t06-08", "topic": 6, "pages": "22", "q": "Что верно о транексамовой кислоте (ТНК)?", "options": ["Доза — 1000 мг (1 г)", "Вводится только внутривенно, внутримышечно нельзя", "Наиболее эффективна в течение первого часа", "Вводится быстро, одним нажатием"], "correct": [0, 1, 2], "explain": "ТНК 1 г, только в/в. Каждый шприц (1 ампула + 15 мл NaCl) вводят медленно в течение минуты; без разведения — 50 мг/мин. Быстро не вводить — повреждается стенка сосуда. Эффективнее всего в первый час; угнетает систему разрушения тромбов."}, {"id": "t06-09", "topic": 6, "pages": "23", "q": "Когда вводят препараты для поддержания давления (Кордиамин, Норэпинефрин)?", "options": ["Только после начала восполнения ОЦК, если давление не держится на 90 мм рт. ст.", "В самом начале, до инфузии растворов", "Вместо инфузии растворов, если их нет", "Сразу при любом ранении для профилактики"], "correct": [0], "explain": "Эти препараты вызывают тахикардию и сужение сосудов; без жидкости в сосудах это нагрузка на «пустое» сердце. Сначала восполняют ОЦК, и только если давление 90 мм рт. ст. не достигнуто, а продолжать вливание нельзя, вводят Кордиамин, затем при необходимости Норэпинефрин."}, {"id": "t06-10", "topic": 6, "pages": "26–27", "q": "Помощь при контузии. Что верно?", "options": ["Промедол контуженному категорически противопоказан", "Против рвоты — Ондансетрон или Метоклопрамид", "Если зрачки разной формы — подозревать гематому мозга и ввести транексамовую кислоту 1 г", "Магния сульфат вводят при геморрагическом шоке, чтобы снизить давление"], "correct": [0, 1, 2], "explain": "Промедол противопоказан — угнетает дыхательный центр. От рвоты — Ондансетрон или Метоклопрамид, обезболивание — Кеторолак. Разные зрачки — признак внутричерепного кровотечения, применяют ТНК 1 г. Магния сульфат — при верхнем давлении выше 160 и БЕЗ признаков геморрагического шока; при шоке и обезвоживании нельзя."}, {"id": "t07-01", "topic": 7, "pages": "28", "q": "В течение какого времени в идеале жгут/турникет нужно заменить на повязку или тампонаду?", "options": ["20 минут", "1 час", "2 часа", "Замена не нужна до госпиталя"], "correct": [0], "explain": "Контроль жгута — это прежде всего отслеживание времени. В идеале в течение 20 минут жгут заменяют: при венозном или незначительном кровотечении — на давящую повязку, при обширном артериальном — на тугую тампонаду и давящую повязку."}, {"id": "t07-02", "topic": 7, "pages": "28", "q": "На что заменяют жгут при разном кровотечении?", "options": ["Венозное или незначительное — давящая повязка", "Обширное артериальное — тугая тампонада и давящая повязка", "После замены турникет полностью снимают и убирают в аптечку", "Обширное артериальное — достаточно пластыря"], "correct": [0, 1], "explain": "При тугой тампонаде турникет ослабляют, но ОСТАВЛЯЮТ на конечности на случай возобновления кровотечения. Он должен быть хорошо виден и не перекрываться одеждой или повязками."}, {"id": "t07-03", "topic": 7, "pages": "28", "q": "Что такое эффект «зонтика» при минно-взрывной травме?", "options": ["Разрушение мягких тканей распространяется вверх по конечности при визуально целой коже", "Осколки разлетаются веером и ранят соседей", "Кровотечение останавливается само из-за спазма сосудов", "Ударная волна защищает конечность выше раны"], "correct": [0], "explain": "При минно-взрывной травме разрушения мягких тканей могут распространяться вверх по всей конечности при неповреждённой на вид коже. Это учитывают при выборе места наложения турникета выше раны."}, {"id": "t07-04", "topic": 7, "pages": "28", "q": "Как ослабляют турникет при спасении конечности?", "options": ["На пол-оборота, ждут 3 минуты; если кровотечения нет — снова на пол-оборота и т. д.", "Сразу полностью, чтобы быстрее восстановить кровоток", "На полный оборот каждые 10 минут", "На пол-оборота каждые 30 секунд"], "correct": [0], "explain": "Давят на рану (осторожно при переломе), ослабляют турникет на пол-оборота и ждут 3 минуты. Если кровотечение незначительное или отсутствует — продолжают по пол-оборота с интервалом 3 минуты до полного ослабления."}, {"id": "t07-05", "topic": 7, "pages": "28", "q": "Кровоснабжение конечности восстановлено. Что делают со старым временем наложения жгута?", "options": ["Зачёркивают", "Оставляют как есть", "Стирают вместе со всеми записями", "Дописывают рядом текущее время, старое не трогают"], "correct": [0], "explain": "Старое время обязательно зачёркивают. Иначе, если при эвакуации турникет снова затянут, в госпитале учтут старое время, и это с большой вероятностью приведёт к ампутации."}, {"id": "t07-06", "topic": 7, "pages": "29", "q": "Заменить жгут на повязку или тампонаду не удалось. Что делать?", "options": ["Ослаблять жгут каждые 20–30 минут на 2–3 минуты, давя в это время на рану; время отмечать заново", "Не трогать жгут до госпиталя, сколько бы ни прошло времени", "Снять жгут через 2 часа", "Перекладывать жгут на новое место каждые 10 минут"], "correct": [0], "explain": "Жгут ослабляют каждые 20–30 минут на 2–3 минуты с давлением на рану; новое время записывают, старое зачёркивают. Это повышает шанс сохранить конечность, но увеличивает риск повторного кровотечения и геморрагического шока."}, {"id": "t07-07", "topic": 7, "pages": "29", "q": "Действия при травматической ампутации:", "options": ["Наложить ППИ, сформировав культю", "Ввести транексамовую кислоту 1 г в/в (или Этамзилат в/м — менее эффективен)", "Укрыть раненого — при кровопотере человек всегда мёрзнет", "Ввести Промедол в бедро повреждённой ноги"], "correct": [0, 1, 2], "explain": "Осмотреть и обработать рану, наложить ППИ с формированием культи, ввести ТНК или Этамзилат, перенести турникет на ширину ладони выше отрыва и снять стартовый жгут, при боли — Нефопам шприц-тюбиком в плечо, укрыть раненого, поставить капельницу со Стерофундином 500–1000 мл."}, {"id": "t07-08", "topic": 7, "pages": "29", "q": "Что НЕЛЬЗЯ тампонировать?", "options": ["Грудную и брюшную полости", "Полость черепа и естественные отверстия", "Открытые переломы", "Глубокую рану бедра с артериальным кровотечением"], "correct": [0, 1, 2], "explain": "Нельзя тампонировать грудную и брюшную полости, полость черепа, естественные отверстия, открытые переломы. Глубокая рана конечности с повреждённой артерией — как раз показание к тугой тампонаде."}, {"id": "t07-09", "topic": 7, "pages": "29–30", "q": "Правила тугой тампонады:", "options": ["Работать в двух медицинских перчатках", "Тампонада должна выступать над раной на 2–3 см", "Прижать двумя руками на 10 минут (обычный бинт) или на 3 минуты (бинт с гемостатиком)", "Начинать тампонировать с края раны, подальше от кровоточащего сосуда"], "correct": [0, 1, 2], "explain": "Две перчатки — одна может порваться. Желательно нащупать кровоточащий сосуд и начинать именно с него; заполнить все «ответвления» канала; когда бинт кончился — оставить хвостик снаружи. Тампонада выступает на 2–3 см, прижимают 10 или 3 минуты, затем давящая повязка."}, {"id": "t07-10", "topic": 7, "pages": "28, 30", "q": "Во время транспортировки на давящей повязке появилось пятно крови. Что делать?", "options": ["Обвести пятно маркером и наблюдать; если растёт — затянуть турникет и записать новое время", "Сразу снять повязку и сделать новую", "Не обращать внимания — это нормально", "Полить повязку перекисью"], "correct": [0], "explain": "Пятно обводят маркером. Если оно увеличивается — открылось кровотечение: затянуть турникет, записать новое время, наложить поверх ещё одну давящую повязку, медленно ослабить турникет и наблюдать."}, {"id": "t08-01", "topic": 8, "pages": "31", "q": "Приоритеты в «красной» зоне:", "options": ["Выполнение боевой задачи в приоритете", "При получении ранения — в приоритете самопомощь", "Перед выдвижением к раненому убедиться в собственной безопасности", "Сразу бежать к раненому, даже под огнём"], "correct": [0, 1, 2], "explain": "В «красной» зоне в приоритете боевая задача; раненый в первую очередь помогает себе сам. Перед выдвижением — убедиться в своей безопасности; при минно-взрывной травме — с сапёром; проверить раненого на гранаты; при спутанном сознании изъять оружие."}, {"id": "t08-02", "topic": 8, "pages": "31", "q": "Осмотр видимых повреждений в «красной» зоне. Что верно?", "options": ["Средства индивидуальной бронезащиты не снимают, раненого не раздевают", "Снимают бронежилет и шлем для полного осмотра", "Раздевают раненого до пояса", "Снимают обувь, чтобы проверить ноги"], "correct": [0], "explain": "В «красной» зоне СИБЗ не снимают и раненого не раздевают — ищут кровь на экипировке, отрыв конечности, видимые раны и останавливают массивное кровотечение жгутом максимально высоко и туго."}, {"id": "t08-03", "topic": 8, "pages": "31", "q": "Опасность поражения велика. Каков порядок действий?", "options": ["Сначала переместить раненого в ближайшее укрытие, затем проверять дыхание и останавливать кровотечение", "Сначала полный осмотр, затем перемещение", "Оставить раненого на месте до темноты", "Сначала поставить капельницу"], "correct": [0], "explain": "Если велика опасность поражения, раненого сначала перемещают в ближайшее укрытие, потом выполняют пункты 3–5 (дыхание, осмотр, остановка кровотечения). Если задержаться нельзя, а раненый без сознания на спине — хотя бы перевернуть на бок."}, {"id": "t08-04", "topic": 8, "pages": "31", "q": "Какие перчатки надевают перед осмотром в «жёлтой» зоне?", "options": ["Медицинские, НЕ тёмного цвета", "Любые тактические", "Медицинские чёрные", "Работают без перчаток, чтобы лучше чувствовать"], "correct": [0], "explain": "Надевают медицинские перчатки не тёмного цвета: при осмотре каждой зоны перчатки проверяют на наличие крови."}, {"id": "t08-05", "topic": 8, "pages": "32", "q": "Какие зоны входят в 5 критических зон осмотра (где крупные артерии близко к поверхности)?", "options": ["Шея", "Подмышки", "Паховая область", "Кисти и стопы"], "correct": [0, 1, 2], "explain": "Пять критических зон: шея, подмышки, артерии рук, паховая область, артерии бёдер. Каждую осматривают отдельно, каждый раз проверяя перчатки на кровь (в темноте — по запаху)."}, {"id": "t08-06", "topic": 8, "pages": "31, 34", "q": "Гематомы вокруг обоих глаз и за ушами могут говорить о…", "options": ["Переломе основания черепа", "Переломе рёбер", "Напряжённом пневмотораксе", "Переутомлении"], "correct": [0], "explain": "Гематомы за ушами и симметричные гематомы вокруг обоих глаз — признак перелома основания черепа. О том же говорят маслянистая жидкость из носа и постоянное кровотечение из ушей."}, {"id": "t08-07", "topic": 8, "pages": "34–35", "q": "Какие соответствия «признак — повреждение» верны?", "options": ["«Коробочный» звук при простукивании груди — пневмоторакс", "Приапизм (стойкая эрекция) — повреждение позвоночника и спинного мозга", "Кровь на головке пениса — ранение мочевого пузыря", "Симметричные гематомы вокруг глаз — перелом рёбер"], "correct": [0, 1, 2], "explain": "Коробочный звук — пневмоторакс; приапизм — повреждение позвоночника и спинного мозга в нижних отделах; кровь из пениса — ранение мочевого пузыря. Симметричные гематомы вокруг глаз — перелом основания черепа, а не рёбер."}, {"id": "t08-08", "topic": 8, "pages": "32–33", "q": "Как проводят осмотр «кошачьей лапой»?", "options": ["Цепляясь за край раны, смещают кожу руками параллельно в разные стороны, чтобы открыть мелкие раны", "Простукивают грудь кончиками пальцев", "Проводят по позвоночнику тремя пальцами", "Сдавливают конечность с двух сторон"], "correct": [0], "explain": "Руками, параллельными друг другу, смещают кожу в разные стороны — так открываются мелкие раны. Далеко руки не просовывают, проверяют последовательно небольшие зоны."}, {"id": "t08-09", "topic": 8, "pages": "32–33", "q": "Что верно при осмотре раненого?", "options": ["При ранении ног срезают шнурки, при ранении рук снимают кольца и браслеты — конечности отекут", "По умолчанию все ранения считаются проникающими, пока не доказано обратное", "Проверяют манжеты рукавов, штанины и обувь — туда может стекать кровь", "Ботинки разрезают целиком, а не шнурки"], "correct": [0, 1, 2], "explain": "Конечности отекают, поэтому шнурки срезают, кольца и браслеты снимают. Все ранения — проникающие, пока не доказано обратное. Кровь может стекать в рукава, штанины, обувь. На ботинках разрезают шнурки, а не сами ботинки."}, {"id": "t08-10", "topic": 8, "pages": "33", "q": "Живот напряжённый, органы не выпали — вероятно внутреннее кровотечение. Что делать?", "options": ["Наложить повязку на живот с умеренным давлением", "Ввести транексамовую кислоту в/в", "Приложить холод к животу", "Дать раненому выпить тёплой воды"], "correct": [0, 1, 2], "explain": "При напряжённом животе без выпадения органов: повязка на живот с умеренным давлением, ТНК в/в на физрастворе, холод на живот (гипотермический пакет «Снежок»). Такого раненого нужно как можно быстрее доставить в медицинскую организацию."}, {"id": "t09-01", "topic": 9, "pages": "36", "q": "Помощь при повреждении глаза:", "options": ["Промыть глаз чистой водой", "Закапать Лидокаин 2% — не более 3 капель", "Торчащий осколок не извлекать, изолировать глаз щитком (или ложкой, пластиком, «бубликом» из бинта)", "Аккуратно извлечь осколок пинцетом"], "correct": [0, 1, 2], "explain": "Промыть водой, обезболить Лидокаином 2% (не более 3 капель), через 10 минут — Тобрадекс. При проникающем ранении без торчащего предмета — давящая повязка на глаз. Торчащий осколок не извлекать, изолировать щитком."}, {"id": "t09-02", "topic": 9, "pages": "36", "q": "Зачем при ранении глаза закрывают бинтом оба глаза, включая здоровый?", "options": ["Глаза двигаются вместе: при движении здорового двигается и раненый", "Чтобы раненый не видел свою рану", "Чтобы защитить здоровый глаз от инфекции", "Так проще закрепить повязку"], "correct": [0], "explain": "Глаз — парный орган: при движении здорового глаза двигается и раненый, поэтому закрывают оба."}, {"id": "t09-03", "topic": 9, "pages": "36", "q": "Признаки перелома:", "options": ["Крепитация — хруст, щелчки отломков при движении", "Патологическая подвижность конечности", "Неестественный угол сгибания в суставе", "Отсутствие боли при прощупывании"], "correct": [0, 1, 2], "explain": "Признаки: крепитация, торчащие кости, патологическая подвижность, неестественный угол, припухлость и БОЛЕЗНЕННОСТЬ при прощупывании, отёк, синюшность, гематома, локальное напряжение мышц."}, {"id": "t09-04", "topic": 9, "pages": "36", "q": "Что ЗАПРЕЩЕНО при переломах?", "options": ["Самостоятельно извлекать обломки костей из раны", "Тампонировать открытый перелом", "Обкладывать торчащее инородное тело перевязочным материалом", "Иммобилизировать конечность"], "correct": [0, 1], "explain": "Запрещено извлекать обломки костей и тампонировать открытый перелом. Торчащее инородное тело, наоборот, обкладывают перевязочным материалом и забинтовывают."}, {"id": "t09-05", "topic": 9, "pages": "36", "q": "Какая повязка при переломе рёбер?", "options": ["Круговая стягивающая повязка на грудь — на выдохе", "Круговая стягивающая повязка — на глубоком вдохе", "Окклюзионный пластырь с клапаном", "Повязку не накладывают"], "correct": [0], "explain": "При переломе рёбер накладывают круговую стягивающую повязку на грудь на выдохе."}, {"id": "t09-06", "topic": 9, "pages": "37", "q": "Блокада места закрытого перелома. Что верно?", "options": ["Предпочтительнее Лидокаин; Новокаин — при аллергии на Лидокаин", "В гематому вводят 200–400 мг 1% раствора", "Обезболивание наступает через 5–10 минут", "Иглу вводят там, где отломки лежат прямо под кожей"], "correct": [0, 1, 2], "explain": "Сначала 0,5% раствор в кожу до «лимонной корки» — в стороне от крупных сосудов и нервов и НЕ там, где отломки под кожей. Затем большой иглой до кости, проверка крови в шприце (игла в гематоме) и 200–400 мг 1% Лидокаина (или Новокаина). Эффект через 5–10 минут."}, {"id": "t09-07", "topic": 9, "pages": "37", "q": "Помощь при выпадении кишечника:", "options": ["Обложить выпавшие петли бинтами или ППИ, прикрыть повязкой, увлажнённой NaCl или чистой водой (в тёплое время года)", "Накрыть плёнкой или пакетом, чтобы повязка и органы не высыхали", "Аккуратно вправить петли обратно", "Дать раненому попить"], "correct": [0, 1], "explain": "Запрещается: лить в брюшную полость антисептики, вправлять петли, тампонировать брюшную полость, давать пить (если хочет пить — приложить к губам мокрую марлю). Повязку накладывают без натяжения."}, {"id": "t09-08", "topic": 9, "pages": "37", "q": "В каком положении эвакуируют раненого с выпадением кишечника?", "options": ["На спине, ноги согнуты в тазобедренных и коленных суставах", "На животе", "Полусидя с прямыми ногами", "На боку с прямыми ногами"], "correct": [0], "explain": "Эвакуация — на спине с согнутыми в тазобедренных и коленных суставах ногами."}, {"id": "t09-09", "topic": 9, "pages": "38", "q": "Первая помощь при термических ожогах:", "options": ["Ожоги более 10% тела охлаждать не более 5–10 минут; при дрожи — прекратить", "Тугие повязки запрещены — только рыхлая повязка или чистая ткань", "Как можно скорее снять кольца, браслеты, часы", "Летом укрывать раненого не нужно"], "correct": [0, 1, 2], "explain": "Охлаждение (проточная вода или гидрогелевые повязки), рыхлое укрытие, снятие колец и часов, питьё, утепление — даже при плюсовой температуре. При ожоге более 10% тела 2–3 степени — срочная эвакуация."}, {"id": "t09-10", "topic": 9, "pages": "38", "q": "Сколько дать выпить пострадавшему с ожогом?", "options": ["Не менее 1 литра: 0,5 л сразу и 0,5 л через 15–20 минут", "Не давать пить совсем", "Один стакан", "3 литра сразу"], "correct": [0], "explain": "Напоить не менее чем литром жидкости (минеральная вода, Регидрон): 0,5 л сразу и 0,5 л через 15–20 минут. В сознании — положение полусидя, без сознания — устойчивое полубоковое."}, {"id": "t09-11", "topic": 9, "pages": "38", "q": "Термический ожог глаз. Что делают в первую очередь?", "options": ["Как можно быстрее изолируют раненого от яркого света", "Накладывают давящую повязку на глаз", "Промывают глаз горячей водой", "Закапывают Сульфацил натрия до обезболивания"], "correct": [0], "explain": "Порядок: изолировать от яркого света; закапать Инокаин 0,5% или Лидокаин 2% (не более 3 капель); системное обезболивание; затем Сульфацил натрия 20% или Тобрадекс по 2 капли в каждый глаз."}, {"id": "t09-12", "topic": 9, "pages": "38", "q": "Действия при утоплении:", "options": ["«Мокрое» — перевернуть на живот, перекинуть через бедро, очистить рот, похлопывая по спине, сжимать грудную клетку", "«Мокрое» — надавить на корень языка, вызвав рвоту", "«Сухое» — сразу СЛР, предварительно проверив дыхание, сердцебиение и зрачки", "«Сухое» — перекинуть через бедро и вылить воду из лёгких"], "correct": [0, 1, 2], "explain": "При «мокром» утоплении в лёгких много воды — её удаляют, вызывают рвоту; если нет кашля, рвоты, дыхания и сердцебиения — СЛР. При «сухом» (рефлекторный спазм, чаще в холодной воде) воды в лёгких нет — сразу СЛР."}, {"id": "t09-13", "topic": 9, "pages": "39", "q": "Синдром длительного сдавления (СДС). Что делают ПЕРЕД освобождением конечности?", "options": ["Вводят обезболивающее и накладывают жгут немного выше места сдавления", "Сразу освобождают конечность, жгут не нужен", "Накладывают жгут только после освобождения", "Растирают конечность для восстановления кровотока"], "correct": [0], "explain": "Порядок: обезболить; наложить жгут/турникет немного выше места сдавления; только потом высвободить конечность и оценить её жизнеспособность."}, {"id": "t09-14", "topic": 9, "pages": "39", "q": "СДС: конечность освобождена. Что верно?", "options": ["Холодная, нечувствительная, сильно отёкшая конечность скорее всего мертва — жгут НЕ снимают", "Если сохранены хотя бы пассивные движения в суставе — жгут снимают постепенно", "Конечность бинтуют эластичным бинтом от жгута вниз, накладывают шину и холод", "Конечность согревают грелкой"], "correct": [0, 1, 2], "explain": "При явной нежизнеспособности жгут не снимают — продукты распада убьют раненого. Конечность бинтуют эластичным бинтом от жгута вниз, шинируют и обкладывают ХОЛОДОМ; согревают самого раненого (одеяла, тёплое питьё, электролитный раствор)."}, {"id": "t10-01", "topic": 10, "pages": "40", "q": "Не позднее какого срока израильский бандаж нужно заменить на обычный стерильный бинт и почему?", "options": ["4–6 часов: синтетическая основа мешает поступлению кислорода, развивается анаэробная инфекция", "24 часа: бандаж теряет эластичность", "1 час: бандаж пережимает артерии", "Замена не нужна — бандаж можно носить до госпиталя"], "correct": [0], "explain": "Израильский бандаж применяют для остановки кровотечения на поле боя и при транспортировке. Надолго оставлять нельзя: синтетическая основа препятствует поступлению кислорода, что способствует анаэробной инфекции. Заменить не позднее 4–6 часов."}, {"id": "t10-02", "topic": 10, "pages": "40", "q": "Основные правила наложения повязок:", "options": ["От более узкого места к более широкому", "Первые два и последние два тура — фиксирующие", "Каждый следующий тур частично перекрывает предыдущий", "Узел завязывают прямо на перевязочном материале над раной"], "correct": [0, 1, 2], "explain": "Бинт разматывают вдоль тела, от узкого места к широкому, «катушкой» вверх; первые и последние два тура фиксирующие; туры перекрываются. Узлы на перевязочном материале НЕ вяжут; материал закрывают сверху и снизу."}, {"id": "t10-03", "topic": 10, "pages": "40", "q": "По каким признакам после наложения повязки проверяют, нет ли избыточного пережатия?", "options": ["Цвет кожи в районе бинтования", "Подвижность", "Температура тела под мышкой", "Артериальное давление"], "correct": [0, 1], "explain": "После наложения проверяют цвет кожи в районе бинтования и подвижность. С ожогами особенно осторожно — они отекают, сильно стягивать нельзя."}, {"id": "t10-04", "topic": 10, "pages": "40", "q": "Как правильно снимать старую повязку при перевязке?", "options": ["Если была тампонада глубокой раны — сначала затянуть жгут/турникет выше раны", "Разрезать бинт НЕ по подушке, закрывающей рану", "Не размачивать; в трудноотделяемых местах полить перекисью водорода", "Обильно размочить повязку водой, чтобы легко снялась"], "correct": [0, 1, 2], "explain": "Сначала контроль кровотечения (жгут выше раны при тампонаде глубокой раны), затем бинт разрезают не по подушке. Повязку стараются не размачивать, чтобы на ней осталась большая часть отделяемого; присохшие места поливают перекисью."}, {"id": "t10-05", "topic": 10, "pages": "40", "q": "Что делать с глубоко засевшими в ране осколками и поражающими элементами при перевязке?", "options": ["Не вынимать и зафиксировать перед наложением новой повязки", "Обязательно извлечь пинцетом", "Протолкнуть глубже, чтобы не мешали повязке", "Извлечь только металлические"], "correct": [0], "explain": "Убирают только поверхностный мусор и неглубоко лежащие инородные тела. Глубоко засевшие предметы, поражающие элементы, осколки костей не вынимают и фиксируют (например, кусками бинта)."}, {"id": "t10-06", "topic": 10, "pages": "40–41", "q": "Обработка раны при перевязке. Что верно?", "options": ["Промывают Хлоргексидином, 0,9% NaCl или кипячёной водой", "Ожоги и обморожения НЕЛЬЗЯ обрабатывать перекисью и солевым раствором", "Ожоги и обморожения туго бинтуют, чтобы уменьшить отёк", "Рану оставляют открытой, чтобы подсохла"], "correct": [0, 1], "explain": "Промывают Хлоргексидином, NaCl или кипячёной водой; при сильном загрязнении — перекисью или солевым раствором, кроме ожогов и обморожений. Термические раны нельзя туго бинтовать — отёк нарастает быстро. Рана всегда должна быть закрыта."}, {"id": "t10-07", "topic": 10, "pages": "41", "q": "Как обработать гнойную рану?", "options": ["Сначала промыть перекисью водорода, затем заложить Левомеколь, Офломелид или посыпать Стрептоцидом", "Только промыть водой", "Прижечь йодом и не закрывать", "Смазать маслом и забинтовать туго"], "correct": [0], "explain": "Гнойную рану сначала промывают перекисью водорода, затем закладывают местное противомикробное средство: Левомеколь, Офломелид или Стрептоцид."}, {"id": "t10-08", "topic": 10, "pages": "41", "q": "Как часто нужно менять перевязки и тампонаду?", "options": ["Не реже раза в сутки", "Раз в трое суток", "Только в госпитале", "Каждый час"], "correct": [0], "explain": "Основное правило: менять перевязки и тампонаду не реже раза в сутки."}, {"id": "t11-01", "topic": 11, "pages": "45", "q": "Какие суставы должна фиксировать шина?", "options": ["Один сустав выше и все суставы ниже места перелома", "Только сустав над переломом", "Только место перелома, без суставов", "Все суставы конечности и позвоночник"], "correct": [0], "explain": "Шина должна перекрывать один сустав выше и все суставы ниже места перелома."}, {"id": "t11-02", "topic": 11, "pages": "45–46", "q": "Правила наложения шины:", "options": ["Поверх одежды или ткани, не на голое тело", "Стараться НЕ менять положение травмированной области", "Жгуты, турникеты и повязки шиной и бинтами не закрывать", "Накладывать как можно туже, чтобы шина не сместилась"], "correct": [0, 1, 2], "explain": "Шину моделируют по здоровой конечности, накладывают поверх ткани, не меняя положения травмированной области, не слишком туго (чтобы не нарушить кровообращение), не закрывая жгуты и повязки."}, {"id": "t11-03", "topic": 11, "pages": "45–46", "q": "Что верно об иммобилизации?", "options": ["Любое проникающее ранение конечности считают переломом и шинируют", "Перед иммобилизацией обезболивают", "Любой перелом, даже закрытый и незначительный, фиксируют", "Закрытые незначительные переломы не фиксируют"], "correct": [0, 1, 2], "explain": "Любое проникающее ранение конечности предполагает перелом и требует шины. Перед иммобилизацией — обезболивание. Любой перелом, даже закрытый и незначительный, фиксируют шиной или подручными средствами."}, {"id": "t11-04", "topic": 11, "pages": "46", "q": "Как иммобилизуют перелом бедра и тазобедренного сустава?", "options": ["Тремя шинами: по задней и наружной стороне — от стопы до плечевого сустава и лопатки, по внутренней — до паха", "Одной шиной от колена до паха", "Подвешивают ногу на косынке", "Двумя шинами от стопы до колена"], "correct": [0], "explain": "При переломе бедра и тазобедренного сустава — три шины: по задней и наружной стороне ноги от стопы до плечевого сустава и лопатки, по внутренней — до паха. Без шин ноги можно связать вместе."}, {"id": "t11-05", "topic": 11, "pages": "46", "q": "Иммобилизация при переломе таза:", "options": ["На доску или носилки, ноги согнуты в коленях, под колени валик", "Стопы связывают вместе", "Тазовый бандаж — на уровне больших вертелов и лобкового симфиза", "Ноги выпрямляют и разводят в стороны"], "correct": [0, 1, 2], "explain": "Раненого укладывают на доску или носилки с согнутыми в коленях ногами и валиком под коленями, таз туго забинтовывают, стопы связывают. Тазовый бандаж — на уровне больших вертелов и лобкового симфиза."}, {"id": "t11-06", "topic": 11, "pages": "46", "q": "Положения при транспортировке:", "options": ["ЧМТ (контузия) — лёжа, голова приподнята на 30°", "Большая кровопотеря — ноги подняты под углом 45°", "Перелом позвоночника — лёжа на спине на твёрдой ровной поверхности", "Пневмоторакс — лёжа на животе"], "correct": [0, 1, 2], "explain": "Пневмоторакс — сидя; кровопотеря — ноги подняты на 45°; ЧМТ — лёжа, голова приподнята на 30°; перелом позвоночника — на спине на твёрдом; перелом таза — на спине, ноги согнуты и связаны; без сознания — на боку или на животе."}, {"id": "t12-01", "topic": 12, "pages": "47", "q": "Почему раненого важно согреть?", "options": ["При кровопотере кровь уходит к сердцу, мозгу и лёгким — конечностям достаётся мало", "При понижении температуры кровь медленнее сворачивается", "Холод ускоряет свёртывание крови и вредит этим", "Согревать нужно только зимой"], "correct": [0, 1], "explain": "При большой кровопотере происходит централизация кровообращения (сердце, мозг, лёгкие), а при снижении температуры тела кровь медленнее сворачивается. Поэтому раненого согревают в любое время года."}, {"id": "t12-02", "topic": 12, "pages": "47", "q": "Как правильно согреть раненого термоодеялом?", "options": ["Предварительно снять мокрую одежду", "Проложить ткань или бинт между ног", "Поверх термоодеяла укрыть одеждой — сверху и обязательно снизу", "Мокрую одежду не снимать, чтобы не терять время"], "correct": [0, 1, 2], "explain": "Между ног прокладывают ткань (согревшись, раненый может обмочиться), заворачивают в фольгированное одеяло коконом, предварительно сняв мокрую одежду; поверх укрывают одеждой сверху и обязательно снизу."}, {"id": "t12-03", "topic": 12, "pages": "47", "q": "Основной принцип помощи при переохлаждении и обморожении:", "options": ["Отогревать изнутри: сначала глубокие ткани, затем поверхностные", "Быстро согреть кожу у огня", "Растереть снегом", "Сначала согреть конечности, потом туловище"], "correct": [0], "explain": "Отогревают пострадавшего изнутри: сначала восстанавливают температуру глубоко лежащих тканей, затем поверхностных. Теплоизолирующую повязку накладывают ДО согревания и внесения в тепло."}, {"id": "t12-04", "topic": 12, "pages": "47", "q": "Что НЕЛЬЗЯ делать при обморожении и переохлаждении?", "options": ["Растирать повреждённое место, в том числе тканью и спиртом", "Давать алкоголь", "Согревать конечности быстрее туловища", "Накладывать теплоизолирующую (не давящую) повязку"], "correct": [0, 1, 2], "explain": "Нельзя растирать, использовать открытый огонь, давать алкоголь, согревать резко и согревать конечности быстрее туловища; при тяжёлом переохлаждении нельзя кормить и поить. Теплоизолирующая повязка — правильное действие."}, {"id": "t12-05", "topic": 12, "pages": "47", "q": "Куда кладут грелки при переохлаждении?", "options": ["В проекции крупных артерий (подмышечная, подвздошная), не вплотную к коже, через ткань", "Прямо на обмороженные пальцы", "На голую кожу живота", "Грелки не используют"], "correct": [0], "explain": "Грелки кладут в проекции крупных артерий через ткань, можно в спальник. Резко согревать нельзя: приток холодной крови к сердцу может привести к его остановке. В/в — 500 мл тёплого (37–38 °C) кристаллоида с двумя ампулами Дексаметазона."}, {"id": "t13-01", "topic": 13, "pages": "48", "q": "Когда на доврачебном этапе применяют антибиотики?", "options": ["Когда эвакуация затягивается более чем на 12 часов", "Сразу при любом ранении", "Только при температуре выше 39 °C", "Никогда — только в госпитале"], "correct": [0], "explain": "Антибиотики на доврачебном этапе применяют, если эвакуация затягивается более чем на 12 часов; раневая инфекция может развиться уже через 6 часов после ранения."}, {"id": "t13-02", "topic": 13, "pages": "48", "q": "Как разводят Цефтриаксон 1 г?", "options": ["Для в/м — 2 мл 1% Лидокаина + 2 мл 0,9% NaCl (или 4 мл NaCl)", "Для в/в — только 9 мл 0,9% NaCl в шприце 10 мл", "Для в/в — на Лидокаине, чтобы было не больно", "Для в/м — колоть глубоко в крупную мышцу под 90°"], "correct": [0, 1, 3], "explain": "В/м: Лидокаин 1% + NaCl (при аллергии — Новокаин 0,5% + NaCl, или 4 мл NaCl), глубоко в крупную мышцу под 90°. В/в: только 9 мл NaCl, вводить 2–4 минуты. Новокаин и Лидокаин в вену НЕЛЬЗЯ."}, {"id": "t13-04", "topic": 13, "pages": "48", "q": "В каких случаях к основному антибиотику добавляют Метронидазол (Метрогил)?", "options": ["При переломах, проникающих ранениях в грудную, брюшную, тазовую полости и анаэробных инфекциях", "При любой царапине", "Только при аллергии на Цефтриаксон", "Только при ожогах"], "correct": [0], "explain": "Метронидазол (в/в по инструкции или 500 мг 3 раза в день) добавляют при переломах и проникающих ранениях в полости, а также при анаэробных инфекциях."}, {"id": "t13-05", "topic": 13, "pages": "49", "q": "Газовая гангрена (клостридии). Что верно?", "options": ["Признаки: резкая боль, отёк, похрустывание, серо-землистые мышцы", "До госпиталя — разрезать кожу над раной вдоль мышцы, чтобы попал воздух", "Рану герметично закрыть, чтобы не попал воздух", "Антибиотик — например, Цефтриаксон 2 г каждые 8 часов или Амоксиклав, по возможности с Метронидазолом"], "correct": [0, 1, 3], "explain": "Клостридии — анаэробные бактерии, развиваются без кислорода; воздух их убивает. Поэтому кожу разрезают вдоль мышцы, промывают перекисью, дают антибиотик и делают перевязки не реже раза в сутки. Герметично закрывать рану нельзя."}, {"id": "t14-01", "topic": 14, "pages": "50", "q": "Что входит в «10 важных вопросов» о раненом?", "options": ["Время наложения жгута и время обезболивания", "Аллергия", "Время последнего приёма пищи", "Домашний адрес"], "correct": [0, 1, 2], "explain": "10 вопросов: имя/позывной; возраст; звание, часть, жетон; группа крови; аллергия; дата, время и вид травмы; время наложения жгута; время обезболивания; время последнего приёма пищи; хронические болезни, травмы и операции."}, {"id": "t14-02", "topic": 14, "pages": "50", "q": "Какие графы карточки раненого заполняют заранее?", "options": ["ФИО и позывной", "Аллергия (если не противоречит указаниям командира)", "Время наложения жгута", "Вид боевой травмы"], "correct": [0, 1], "explain": "Заранее заполняют: ФИО, позывной, возраст, звание, часть и жетон, аллергию (если это не противоречит указаниям командира). Время жгута и вид травмы записывают после ранения."}, {"id": "t14-03", "topic": 14, "pages": "50", "q": "Где должна находиться карточка раненого?", "options": ["В аптечке 2-го эшелона", "В кармане штанов", "У командира взвода", "В рюкзаке медика"], "correct": [0], "explain": "Карточка раненого должна быть вложена в аптечку 2-го эшелона — она облегчает работу медиков на следующих этапах эвакуации."}, {"id": "t15-01", "topic": 15, "pages": "51", "q": "Кого относят к «Красной группе» при сортировке?", "options": ["Раненых с неостановленными кровотечениями", "Раненых с пневмотораксом", "Раненых с ранениями шеи и полостными ранениями", "Раненых с ушибами и ссадинами"], "correct": [0, 1, 2], "explain": "«Красные» — в критическом состоянии: нарушение проходимости дыхательных путей, пневмоторакс, неостановленные кровотечения, шок или риск шока, ампутации, глазные травмы, полостные ранения, ранения шеи. Ушибы и ссадины — «зелёные»."}, {"id": "t15-02", "topic": 15, "pages": "51", "q": "Что верно о группах сортировки?", "options": ["«Жёлтые» — повреждения без риска для жизни, ходить не могут", "«Зелёные» — незначительные ранения, могут ходить", "«Чёрным» помощь оказывают в первую очередь", "«Зелёные» — раненые с переломом бедра и шоком"], "correct": [0, 1], "explain": "«Жёлтые» — без риска для жизни (переломы, некритичные кровотечения), не ходят. «Зелёные» — ушибы, вывихи, ссадины, переломы малых костей, ходят. «Чёрные» — несовместимые с жизнью повреждения: помощь в последнюю очередь, обезболивающая. «Фиолетовые» — остановка сердца/дыхания, агония."}, {"id": "t15-03", "topic": 15, "pages": "51", "q": "Каких раненых осматривают в первую очередь?", "options": ["Тех, кто молчит", "Тех, кто громче всех кричит", "Тех, кто ближе к укрытию", "Тех, кто может ходить"], "correct": [0], "explain": "В первую очередь осматривают молчащих: кричит — значит жив. При большой кровопотере кислородное голодание мозга вызывает спутанность сознания и апатию."}, {"id": "t15-04", "topic": 15, "pages": "51", "q": "По упрощённой схеме сортировки (рис. 54) раненый дышит. Какие признаки относят его к «красным»?", "options": ["Частота дыхания более 30 в минуту (за 10 секунд больше 5 раз)", "Нет пульса на лучевой артерии", "Капиллярное наполнение (сжать мизинец) дольше 2 секунд", "Выполняет команду, пульс есть, наполнение меньше 2 секунд"], "correct": [0, 1, 2], "explain": "Схема: дыхание есть → ЧДД >30 — «красные»; иначе пульс на лучевой: нет — «красные»; капиллярное наполнение >2 с — «красные»; неврологический тест: не реагирует — «красные», реагирует — «жёлтые»."}, {"id": "t15-05", "topic": 15, "pages": "51", "q": "По схеме сортировки раненый не дышит. Что делают?", "options": ["Обеспечивают проходимость дыхательных путей: не задышал — «чёрные», задышал — продолжают сортировку (считают частоту дыхания и т. д.)", "Сразу относят к «чёрным»", "Сразу относят к «жёлтым»", "Сразу относят к «красным», не открывая дыхательные пути"], "correct": [0], "explain": "Если дыхания нет — обеспечивают проходимость дыхательных путей. Не задышал — «чёрные». Задышал — раненого оценивают дальше по схеме: частота дыхания, пульс на лучевой, капиллярное наполнение, реакция на команду."}];
const TOPICS = {"1": "Остановка кровотечения", "2": "Дыхательные пути, СЛР", "3": "Пневмоторакс", "4": "Обезболивание", "5": "Внутривенный доступ", "6": "Шок и инфузии", "7": "Контроль жгута, тампонада", "8": "Алгоритмы осмотра", "9": "Прочие повреждения", "10": "Перевязки", "11": "Иммобилизация, транспортировка", "12": "Терморегуляция", "13": "Антибиотики", "14": "Информация по раненому", "15": "Сортировка раненых", "16": "Прил.: эшелоны снаряжения", "17": "Прил.: группы препаратов", "18": "Прил.: препараты для активности", "19": "Прил.: рюкзак медика", "20": "Прил.: БОВ", "21": "Прил.: Заболевание — Лечение", "22": "Прил.: приказ № 760"};
const RANDOM_COUNT = 30;
const STORE_KEY = "takmed-test-v1";

const app = document.getElementById("app");
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));
let state = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function hhmm(t) {
  const d = new Date(t);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function isCorrect(q, picked) {
  const a = [...picked].sort(), b = [...q.correct].sort();
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function save() {
  try { state ? localStorage.setItem(STORE_KEY, JSON.stringify(state)) : localStorage.removeItem(STORE_KEY); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && Array.isArray(s.queue) && s.queue.every(id => byId[id])) return s;
  } catch (e) {}
  return null;
}

function setStamp() {
  document.getElementById("stamp").textContent = state ? "Начало " + hhmm(state.startedAt) : "";
}

function start(mode, ids) {
  const pool = ids || BANK.map(q => q.id);
  const queue = mode === "random" ? shuffle(pool).slice(0, RANDOM_COUNT) : shuffle(pool);
  const order = {};
  queue.forEach(id => { order[id] = shuffle(byId[id].options.map((_, i) => i)); });
  state = { mode, queue, order, answers: {}, idx: 0, planned: queue.length, startedAt: Date.now(), done: false };
  save(); render();
}

function render() {
  setStamp();
  if (!state) return renderStart();
  if (state.done) return renderResult();
  renderQuestion();
}

function renderStart() {
  const saved = load();
  const resume = saved && !saved.done
    ? `<div class="resume"><span>Есть незаконченный тест: ${saved.idx} из ${saved.queue.length}, начат в ${hhmm(saved.startedAt)}.</span>
        <button class="btn ghost" id="resume">Продолжить</button></div>` : "";
  app.innerHTML = `
    <div class="wrap">
      <h1>Проверьте себя по тактической медицине</h1>
      <p class="lead">${BANK.length} ${plural(BANK.length, "вопрос", "вопроса", "вопросов")} по 15 этапам первой помощи и приложениям конспекта: от жгута до приказа № 760.</p>
      ${resume}
      <div class="modes">
        <button class="mode" id="m-random">
          <span class="num">${Math.min(RANDOM_COUNT, BANK.length)}</span>
          <span class="name">Случайные вопросы</span>
          <span class="hint">Каждый раз новый набор из банка.</span>
        </button>
        <button class="mode" id="m-all">
          <span class="num">${BANK.length}</span>
          <span class="name">Весь банк</span>
          <span class="hint">Все вопросы подряд. Прогресс сохраняется, можно продолжить позже.</span>
        </button>
      </div>
      <ul class="rules">
        <li>Правильных вариантов может быть один или несколько.</li>
        <li>Вопрос засчитывается, только если отмечены все правильные варианты и ни одного лишнего.</li>
        <li>В конце — счёт, разбор ошибок и страницы конспекта для повторения.</li>
      </ul>
      <div class="by-topic">
        <h2>По темам</h2>
        <p class="lead">Все вопросы одной темы в случайном порядке.</p>
        <h3>Этапы первой помощи</h3>
        <div class="tlist">${topicButtons(t => t <= 15)}</div>
        <h3>Приложения</h3>
        <div class="tlist">${topicButtons(t => t > 15)}</div>
      </div>
    </div>`;
  document.getElementById("m-random").onclick = () => start("random");
  document.getElementById("m-all").onclick = () => start("all");
  app.querySelectorAll(".tbtn").forEach(b => b.onclick = () => {
    const t = Number(b.dataset.topic);
    start("topic", BANK.filter(q => q.topic === t).map(q => q.id));
    window.scrollTo(0, 0);
  });
  const r = document.getElementById("resume");
  if (r) r.onclick = () => { state = saved; render(); };
}

function topicButtons(filter) {
  const counts = {};
  BANK.forEach(q => { counts[q.topic] = (counts[q.topic] || 0) + 1; });
  return Object.keys(counts).map(Number).filter(filter).sort((a, b) => a - b).map(t => {
    const name = String(TOPICS[t] || t).replace(/^Прил\.:\s*/, "");
    const no = t <= 15 ? `<span class="tno">${t}</span>` : "";
    return `<button class="tbtn" data-topic="${t}"><span class="tn">${no}${esc(name)}</span>
      <span class="tc">${counts[t]} ${plural(counts[t], "вопрос", "вопроса", "вопросов")}</span></button>`;
  }).join("");
}

function renderQuestion() {
  const id = state.queue[state.idx];
  const q = byId[id];
  const total = state.queue.length;
  const pct = Math.round(state.idx / total * 100);
  const opts = state.order[id].map((orig, k) => `
    <label class="opt" for="o${k}">
      <input type="checkbox" id="o${k}" value="${orig}">
      <span>${esc(q.options[orig])}</span>
    </label>`).join("");
  app.innerHTML = `
    <div class="wrap">
      <div class="progress">
        <div class="progress-row"><span>Вопрос ${state.idx + 1} из ${total}</span><span>${pct}%</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
      <section class="card">
        <div class="meta"><span class="chip">${esc(TOPICS[q.topic] || "")}</span><span class="pg">стр. ${esc(q.pages)}</span></div>
        <p class="q">${esc(q.q)}</p>
        <p class="note">Отметьте все правильные варианты.</p>
        <div class="opts">${opts}</div>
      </section>
      <div class="actions">
        <button class="btn link" id="quit">Завершить тест</button>
        <button class="btn" id="answer" disabled>${state.idx + 1 === total ? "Ответить и посмотреть итог" : "Ответить"}</button>
      </div>
    </div>`;
  const boxes = [...app.querySelectorAll(".opt input")];
  const btn = document.getElementById("answer");
  boxes.forEach(b => b.onchange = () => { btn.disabled = !boxes.some(x => x.checked); });
  btn.onclick = () => {
    state.answers[id] = boxes.filter(x => x.checked).map(x => Number(x.value));
    state.idx++;
    if (state.idx >= total) state.done = true;
    save(); render(); window.scrollTo(0, 0);
  };
  document.getElementById("quit").onclick = () => {
    state.queue = state.queue.slice(0, state.idx);
    state.done = true;
    save(); render(); window.scrollTo(0, 0);
  };
}

function renderResult() {
  const asked = state.queue.filter(id => state.answers[id]);
  const wrong = asked.filter(id => !isCorrect(byId[id], state.answers[id]));
  const right = asked.length - wrong.length;
  const pct = asked.length ? Math.round(right / asked.length * 100) : 0;

  const perTopic = {};
  wrong.forEach(id => {
    const q = byId[id];
    const t = perTopic[q.topic] || (perTopic[q.topic] = { n: 0, pages: new Set() });
    t.n++; t.pages.add(q.pages);
  });
  const topicRows = Object.entries(perTopic).sort((a, b) => b[1].n - a[1].n).map(([t, v]) => `
    <li><span class="t">${esc(TOPICS[t] || t)} <span class="pg">· стр. ${esc([...v.pages].join("; "))}</span></span>
    <span class="c">${v.n} ${plural(v.n, "ошибка", "ошибки", "ошибок")}</span></li>`).join("");

  const misses = wrong.map(id => {
    const q = byId[id];
    const picked = new Set(state.answers[id]);
    const rows = state.order[id].map(i => {
      const isRight = q.correct.includes(i), isPicked = picked.has(i);
      if (!isRight && !isPicked) return `<li class="plain"><span class="mark"></span><span>${esc(q.options[i])}</span></li>`;
      const cls = isRight ? "right" : "wrong";
      const mark = isRight ? (isPicked ? "✓ верно" : "✓ пропущен") : "✗ лишний";
      return `<li class="${cls}"><span class="mark">${mark}</span><span>${esc(q.options[i])}</span></li>`;
    }).join("");
    return `
      <section class="card miss">
        <div class="meta"><span class="chip">${esc(TOPICS[q.topic] || "")}</span><span class="pg">стр. ${esc(q.pages)}</span></div>
        <p class="q">${esc(q.q)}</p>
        <ul class="ans">${rows}</ul>
        <p class="why"><b>Почему:</b> ${esc(q.explain)}</p>
      </section>`;
  }).join("");

  app.innerHTML = `
    <div class="wrap">
      <h2>Итог</h2>
      <div class="score">
        <span class="big">${right}</span>
        <span class="of">из ${asked.length} верно · ${pct}%${asked.length < state.planned ? " · тест завершён досрочно" : ""}</span>
      </div>
      ${asked.length === 0 ? `<p class="lead">Ни на один вопрос не дан ответ.</p>` :
        wrong.length === 0 ? `<div class="allgood">Ошибок нет. Все вопросы засчитаны.</div>` : `
      <div class="section">
        <h2>Что повторить</h2>
        <ul class="topics">${topicRows}</ul>
      </div>
      <div class="section">
        <h2>Разбор ошибок</h2>
        ${misses}
      </div>`}
      <div class="actions">
        ${wrong.length ? `<button class="btn ghost" id="redo">Повторить ошибки (${wrong.length})</button>` : "<span></span>"}
        <button class="btn" id="again">Новый тест</button>
      </div>
    </div>`;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => { start("retry", wrong); window.scrollTo(0, 0); };
  document.getElementById("again").onclick = () => { state = null; save(); render(); window.scrollTo(0, 0); };
}

state = null;
render();
</script>
</body>
</html>
